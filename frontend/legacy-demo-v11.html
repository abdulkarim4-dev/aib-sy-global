<style>
:root{--bg:#111417;--panel:#20262c;--panel2:#2b333b;--line:#48515a;--gold:#aeb8c2;--gold2:#e2e7eb;--txt:#f2f4f5;--muted:#aab2ba;--green:#83c6a0;--red:#ef795f;--silver:#cbd2d8;--accent:#e85b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#101418,#252c33 55%,#39434c);box-shadow:0 8px 30px #0008;position:sticky;top:0;z-index:4}.brand{font-size:25px;font-weight:900;color:#d4dbe1;letter-spacing:2px}.site-brand{display:flex;align-items:center;gap:12px}.site-brand img{width:66px;height:58px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}.brand small{display:block;font-size:12px;letter-spacing:0;color:#ddd;font-weight:400;margin-top:4px}.wrap{max-width:1400px;margin:auto;padding:18px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.sidebar,.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px}.sidebar{padding:12px;height:max-content;position:sticky;top:90px}.nav{width:100%;text-align:right;padding:12px 13px;margin:3px 0;background:transparent;color:var(--txt);border:0;border-radius:8px;cursor:pointer;font-size:14px}.nav.active,.nav:hover{background:linear-gradient(120deg,#39434c,#252c33);color:#fff;box-shadow:inset 0 0 0 1px #68737e}main{min-width:0}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}h1{font-size:22px;margin:0;color:#dce2e7}h2{font-size:17px;margin:0 0 12px;color:#dce2e7}.muted{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{padding:15px}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font-size:21px;color:#dce2e7}.panel{padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #000 :none}.right{display:flex;gap:8px;align-items:center}.foot{color:#777;text-align:center;font-size:11px;padding:18px}.pill{color:#dce2e7;border:1px solid #8b713d;background:linear-gradient(135deg,#28241d,#171b20);border-radius:20px;padding:5px 9px;font-size:11px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:grid;grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.cashgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){header{padding:13px}.wrap{padding:10px}.formgrid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:18px}}

function attemptLogin(username,password){
 const lockUntil=Number(localStorage.getItem('aib_login_lock_until')||0);if(Date.now()<lockUntil){renderLogin();return false;}
 const un=String(username||'').trim();const u=users.find(x=>x.username===un&&x.password===password&&x.active);
 if(!u){let fails=Number(sessionStorage.getItem('aib_login_failures')||0)+1;sessionStorage.setItem('aib_login_failures',String(fails));logActivity('محاولة دخول فاشلة','اسم المستخدم: '+un+' · المحاولة '+fails);if(fails>=3){localStorage.setItem('aib_login_lock_until',String(Date.now()+5*60*1000));sessionStorage.removeItem('aib_login_failures');renderLogin('تم إيقاف الدخول خمس دقائق بعد ثلاث محاولات خاطئة.');}else{renderLogin('اسم المستخدم أو كلمة المرور غير صحيحة. تبقت '+(3-fails)+' محاولة.');document.getElementById('loginUsername').value=un;}return false;}
 sessionStorage.removeItem('aib_login_failures');localStorage.removeItem('aib_login_lock_until');activeUser={id:u.id,name:u.name,username:u.username,role:u.role,permissions:u.permissions};sessionStorage.setItem('aib_session_v1',JSON.stringify(activeUser));logActivity('تسجيل دخول','نجاح');document.body.classList.remove('auth-locked');document.getElementById('loginScreen')?.remove();document.getElementById('activeUser').textContent='المستخدم الحالي: '+(activeUser.name||activeUser.username);render();applyLanguage();return true;
}
function login(){
 let storedUser=activeUser&&users.find(u=>u.id===activeUser.id&&u.active);
 if(storedUser){activeUser={id:storedUser.id,name:storedUser.name,username:storedUser.username,role:storedUser.role,permissions:storedUser.permissions};document.body.classList.remove('auth-locked');return true;}
 activeUser=null;sessionStorage.removeItem('aib_session_v1');renderLogin();return false;
}

function activityLogPage(el){if(activeUser?.role!=='owner'){el.innerHTML='<div class="notice">هذا السجل متاح للمدير فقط.</div>';return;}el.innerHTML=`<div class="headrow"><div><h1>سجل حركة المستخدمين</h1><div class="muted">تسجيل الدخول والإضافة والتعديل والحذف وطلبات الموظفين</div></div><button class="btn secondary" onclick="exportLogs()">تصدير السجل</button></div><div class="panel"><div class="tablewrap"><table><thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>${activityLogs.map(x=>`<tr><td>${new Date(x.at).toLocaleString('ar')}</td><td>${x.user}</td><td>${x.action}</td><td>${x.details||''}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد حركات بعد</td></tr>'}</tbody></table></div></div>`;}function exportLogs(){let csv='\ufeff'+[['التاريخ','المستخدم','العملية','التفاصيل'],...activityLogs.map(x=>[x.at,x.user,x.action,x.details])].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'AIB-user-activity.csv');}

let currency=localStorage.getItem('aib_currency_v1')||'USD';function setCurrency(v){currency=v==='SYP'?'SYP':'USD';localStorage.setItem('aib_currency_v1',currency);render();applyLanguage();}function money(n){return (Number(n)||0).toLocaleString(currency==='SYP'?'ar-SY':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+(currency==='SYP'?' ل.س':' $')}
function sec(id){return sections.find(s=>s.id===id)}
function boxFor(r){if(r.section==='deposit'&&r.operationType==='مصروف')return 'صندوق الإيداع';return r.cash||sec(r.section)?.box}
function ledger(box){let total=0;db.records.forEach(r=>{if(boxFor(r)===box){if(r.section==='deposit'){let v=Number(r.paid||0);total+=(r.operationType==='مصروف'?-Math.abs(Number(r.expense||v)):v)}if(r.section==='consignSale'||r.section==='directSale')total+=Number(r.paid??r.sale??0);if(r.section==='purchase')total-=Number(r.paid||0)}});db.moves.filter(m=>m.box===box).forEach(m=>total+=(m.type==='in'?1:-1)*Number(m.amount||0));return total}
function qtyOf(r){return Math.max(1,Number(r.quantity)||1)}
function lineTotal(r){if(r.totalAmount!=null)return Number(r.totalAmount)||0;if(r.section==='purchase')return Number(r.price||0)*qtyOf(r);if(r.section==='deposit')return r.operationType==='مصروف'?Math.abs(Number(r.expense||r.paid||0)):Number(r.amount||0)*qtyOf(r);if(['consignSale','directSale'].includes(r.section))return Number(r.sale||0)*qtyOf(r);return Number(r.amount||r.price||r.sale||0)}
function totals(){let purchases=db.records.filter(r=>r.section==='purchase').reduce((a,r)=>a+lineTotal(r)+Number(r.transport||0)+Number(r.packing||0)+Number(r.loading||0),0);let sales=db.records.filter(r=>['consignSale','directSale'].includes(r.section)).reduce((a,r)=>a+lineTotal(r),0);return {purchases,sales}}

function cashEntries(box){let out=[];db.records.forEach(r=>{if(boxFor(r)!==box)return;let amount=0,label='';if(r.section==='purchase'){amount=-Number(r.paid||0);label='دفعة مشتريات';}else if(r.section==='deposit'){amount=r.operationType==='مصروف'?-Math.abs(Number(r.expense||r.paid||0)):Number(r.paid||0);label=r.operationType==='مصروف'?'مصروف أمانة':'دفعة / إيداع أمانة';}else if(r.section==='consignSale'||r.section==='directSale'){amount=Number(r.paid??r.sale??0);label=r.section==='consignSale'?'قبض مبيع أمانة':'قبض مبيع مباشر';}if(amount)out.push({date:r.date||'',box,type:amount>=0?'in':'out',amount:Math.abs(amount),note:label+' · '+(r.model||r.details||''),source:'عملية'});});db.moves.filter(m=>m.box===box).forEach(m=>out.push({...m,source:'حركة يدوية'}));return out.sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function cashPage(el){el.innerHTML=`<div class="headrow"><div><h1>الصناديق والحركات</h1><div class="muted">اضغط على أي صندوق لعرض كشفه الداخلي بالتفصيل</div></div><div class="right"><button class="btn secondary" onclick="openTransfer()">⇄ تحويل بين الصناديق</button><button class="btn" onclick="openMove()">＋ حركة صندوق</button></div></div><div class="cashgrid">${boxes.map(b=>`<div class="cashcard" role="button" tabindex="0" onclick="showBoxDetail('${b}')"><b>${b}</b><strong>${money(ledger(b))}</strong><div class="muted">اضغط لعرض الحركات والتفاصيل</div></div>`).join('')}</div><div id="boxDetail"></div><div class="panel" style="margin-top:14px"><h2>طباعة تقارير السحب والإيداع</h2><div class="formgrid"><div><label>الصندوق</label><select id="cashReportBox"><option value="all">كل الصناديق</option>${boxes.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>من تاريخ</label><input id="cashFrom" type="date"></div><div><label>إلى تاريخ</label><input id="cashTo" type="date"></div></div><div class="actions"><button class="btn" onclick="printCashReport()">طباعة كشف السحب والإيداع</button></div></div><div class="panel"><h2>سجل حركات الصناديق اليدوية والتحويلات</h2><div class="tablewrap">${db.moves.length?`<table><thead><tr><th>التاريخ</th><th>الصندوق</th><th>نوع الحركة</th><th>المبلغ</th><th>البيان</th><th>إجراء</th></tr></thead><tbody>${db.moves.map(m=>`<tr><td>${m.date}</td><td>${m.box}</td><td><span class="tag ${m.type}">${m.type==='in'?'إيداع':'سحب'}</span></td><td>${money(m.amount)}</td><td>${m.note||''}</td><td><div class="act"><button class="btn secondary small" onclick="editMove('${m.id}')">تعديل</button><button class="btn danger small" onclick="delMove('${m.id}')">حذف</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد حركات يدوية.</div>'}</div></div>`;if(boxes.length)showBoxDetail(boxes[0])}
function showBoxDetail(box){let el=document.getElementById('boxDetail');if(!el)return;let rows=cashEntries(box);let ins=rows.filter(x=>x.type==='in').reduce((a,x)=>a+Number(x.amount),0),outs=rows.filter(x=>x.type==='out').reduce((a,x)=>a+Number(x.amount),0);el.innerHTML=`<div class="panel" style="margin-top:14px"><div class="headrow"><div><h2>${box} – كشف الحركة الداخلي</h2><div class="muted">الرصيد: ${money(ledger(box))} · إيداعات: ${money(ins)} · سحوبات: ${money(outs)}</div></div><button class="btn secondary small" onclick="document.getElementById('cashReportBox').value='${box}';printCashReport()">طباعة كشف هذا الصندوق</button></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>التاريخ</th><th>نوع الحركة</th><th>المبلغ</th><th>البيان</th><th>المصدر</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date||'—'}</td><td><span class="tag ${x.type}">${x.type==='in'?'إيداع':'سحب'}</span></td><td>${money(x.amount)}</td><td>${x.note||''}</td><td>${x.source||'عملية'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد حركات مسجلة لهذا الصندوق.</div>'}</div></div>`}

function invoicePage(el){let groups=[['directSale','فواتير المبيع المباشر · A'],['consignSale','فواتير مبيع الأمانة · D'],['purchase','فواتير المشتريات · B'],['deposit','فواتير الودائع والمصروفات · C']];let html=groups.map(([id,title])=>{let rows=db.records.filter(r=>r.section===id);return `<div class="panel"><div class="headrow"><h2>${title} (${rows.length})</h2></div><div class="tablewrap">${rows.length?`<table><thead><tr><th>رقم الفاتورة</th><th>البيان</th><th>التاريخ</th><th>القيمة</th><th>إجراء</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.invoice||'AIB-'+String(r.id).slice(0,8).toUpperCase()}</td><td>${r.model||r.details||r.activityType||'—'} · العدد ${qtyOf(r)}</td><td>${r.date||''}</td><td>${money(lineTotal(r))}</td><td><button class="btn secondary small" onclick="printInvoice('${r.id}')">طباعة</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">لا توجد فواتير مسجلة في هذا القسم.</div>'}</div></div>`}).join('');el.innerHTML=`<div class="headrow"><div><h1>الفواتير والأرشيف</h1><div class="muted">أرشيف مستقل لفواتير البيع والشراء والودائع المودعة أمانة</div></div></div>${html}`}
function printCashReport(){let box=document.getElementById('cashReportBox').value,from=document.getElementById('cashFrom').value,to=document.getElementById('cashTo').value;let entries=(box==='all'?boxes.flatMap(b=>cashEntries(b)):cashEntries(box)).filter(x=>(!from||x.date>=from)&&(!to||x.date<=to));let ins=entries.filter(x=>x.type==='in').reduce((a,x)=>a+Number(x.amount),0),outs=entries.filter(x=>x.type==='out').reduce((a,x)=>a+Number(x.amount),0);let w=window.open('','_blank');if(!w){alert('يرجى السماح بالنوافذ المنبثقة للطباعة.');return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>كشف الصناديق - مجموعة AIB التجارية</title><style>body{font-family:Tahoma,Arial;padding:28px;color:#202329}.head{border-bottom:4px solid #b89450;padding-bottom:15px}.brand{font-size:28px;color:#8d6a2e;font-weight:bold}.meta{margin:18px 0;color:#555}.stats{display:flex;gap:14px;margin:20px 0}.stat{border:1px solid #c7a45d;padding:12px 22px;min-width:170px}.stat b{display:block;color:#745725;margin-bottom:8px}table{width:100%;border-collapse:collapse}th{background:#202329;color:#f1dfb5}th,td{border:1px solid #ccc;padding:10px;text-align:right}.in{color:#176b43}.out{color:#a33232}.foot{margin-top:25px;border-top:2px solid #c7a45d;padding-top:12px;text-align:center;color:#795d2b}@media print{button{display:none}}</style><div class="head"><div class="brand">AIB | مجموعة AIB التجارية</div><h2>كشف حركة الصناديق – سحب وإيداع</h2></div><div class="meta">الصندوق: ${box==='all'?'كل الصناديق':box}　 |　 الفترة: ${from||'من البداية'} إلى ${to||'حتى اليوم'}　 |　 تاريخ الطباعة: ${new Date().toLocaleDateString('en-GB')}</div><div class="stats"><div class="stat"><b>إجمالي الإيداعات</b>${money(ins)}</div><div class="stat"><b>إجمالي السحوبات</b>${money(outs)}</div><div class="stat"><b>الصافي</b>${money(ins-outs)}</div></div><table><thead><tr><th>التاريخ</th><th>الصندوق</th><th>نوع الحركة</th><th>المبلغ</th><th>البيان</th><th>المصدر</th></tr></thead><tbody>${entries.map(x=>`<tr><td>${x.date||'—'}</td><td>${x.box}</td><td class="${x.type}">${x.type==='in'?'إيداع':'سحب'}</td><td>${money(x.amount)}</td><td>${x.note||''}</td><td>${x.source||''}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد حركات ضمن الفترة المحددة</td></tr>'}</tbody></table><div class="foot">مجموعة AIB التجارية · +963997439627</div><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></html>`);w.document.close()}
function reportPage(el){let t=totals();el.innerHTML=`<div class="headrow"><div><h1>التقارير</h1><div class="muted">ملخصات حسب القسم والصندوق</div></div><button class="btn secondary" onclick="exportCSV()">تصدير CSV</button></div><div class="stats"><div class="stat"><label>إجمالي المشتريات</label><strong>${money(t.purchases)}</strong></div><div class="stat"><label>إجمالي المبيعات</label><strong>${money(t.sales)}</strong></div><div class="stat"><label>صافي المبيعات ناقص المشتريات</label><strong>${money(t.sales-t.purchases)}</strong></div><div class="stat"><label>عدد العمليات</label><strong>${db.records.length}</strong></div></div><div class="panel"><h2>ملخص الأقسام</h2><table><thead><tr><th>القسم</th><th>عدد العمليات</th><th>مجموع القيم</th><th>الصندوق</th></tr></thead><tbody>${sections.map(s=>{let a=db.records.filter(r=>r.section===s.id);let v=a.reduce((x,r)=>x+Number(r.sale??r.amount??r.price??0),0);return `<tr><td>${s.name}</td><td>${a.length}</td><td>${money(v)}</td><td>${s.box||'متعدد حسب العملية'}</td></tr>`}).join('')}</tbody></table></div><div class="panel"><h2>أرصدة الصناديق</h2><table><thead><tr><th>الصندوق</th><th>الرصيد</th></tr></thead><tbody>${boxes.map(b=>`<tr><td>${b}</td><td>${money(ledger(b))}</td></tr>`).join('')}</tbody></table></div><div class="notice">هذا التقرير أولي. لا يعتبر الربح النهائي محاسبياً قبل استكمال قواعد تكلفة البضاعة والذمم وتسويات الأمانات كما في ملف Excel.</div>`}
function fieldHtml(f,val){let [key,label,type]=f;if(key==='invoice')return `<div><label>${label} (تلقائي)</label><input name="invoice" value="${val||'يُنشأ تلقائياً عند الحفظ'}" readonly></div>`;if(type==='operationType')return `<div><label>${label}</label><select name="${key}"><option value="إيداع أمانة" ${val==='مصروف'?'':'selected'}>إيداع أمانة</option><option value="مصروف" ${val==='مصروف'?'selected':''}>مصروف</option></select></div>`;if(key==='activityType')return `<div><label>${label}</label><select name="${key}"><option value="">اختر نوع النشاط</option>${['سيارات','شاحنات','معدات وآليات','قطع غيار','محركات','علب سرعة ودفرنسات','صيانة سيارات','تصليح ميكانيك','كهرباء سيارات','سمكرة ودهان','خدمات أخرى'].map(v=>`<option value="${v}" ${val===v?'selected':''}>${v}</option>`).join('')}</select></div>`;if(type==='select')return `<div><label>${label}</label><select name="${key}">${boxes.map(b=>`<option ${val===b?'selected':''}>${b}</option>`).join('')}</select></div>`;return `<div class="${key==='details'?'field full':''}"><label>${label}</label><input name="${key}" type="${type}" value="${val??''}" ${type==='number'?'step="0.01"':''}></div>`}
const invoicePrefixes={directSale:'A',purchase:'B',deposit:'C',consignSale:'D'};function nextInvoice(section,excludeId=null){let prefix=invoicePrefixes[section]||'X';let nums=db.records.filter(r=>r.section===section&&r.id!==excludeId&&r.invoice).map(r=>{let m=String(r.invoice).match(new RegExp('^'+prefix+'-?(\\d+)$'));return m?Number(m[1]):0});return prefix+'-'+String(Math.max(0,...nums)+1).padStart(4,'0')}
function openForm(id,rid=null){if(rid&&activeUser.role!=='owner'){logActivity('طلب تعديل','طلب الموظف تعديل سجل '+rid+' — يرجى مراجعة المدير');alert('التعديل متاح للمدير فقط. يرجى مراجعة المدير.');return;}let s=sec(id);editId=rid;let old=rid?db.records.find(r=>r.id===rid):{};document.getElementById('formTitle').textContent=(rid?'تعديل':'إضافة')+' — '+s.name;let fields=s.fields.filter(f=>!(f[0]==='quantity'&&['consignSale','directSale'].includes(id)&&/صيانة|تصليح|كهرباء|سمكرة|خدمات/.test(old.activityType||''))).map(f=>fieldHtml(f,old[f[0]]??(f[0]==='date'?new Date().toISOString().slice(0,10):f[0]==='quantity'?1:f[0]==='cash'?'صندوق الإيداع':''))).join('');if(s.box&&id!=='deposit')fields+=`<div><label>الصندوق المرتبط</label><select name="cash">${boxes.map(b=>`<option ${(old.cash||s.box)===b?'selected':''}>${b}</option>`).join('')}</select></div>`;document.getElementById('formFields').innerHTML=fields+`<div class="field full" id="lineTotalPreview" style="padding:12px;border:1px solid #8b713d;border-radius:9px;background:#211d16;color:#f3dfad;font-weight:bold">إجمالي الكمية: —</div>`;let activitySelect=document.querySelector('#recordForm [name=activityType]');if(activitySelect&&['consignSale','directSale'].includes(id)){activitySelect.addEventListener('change',()=>{let q=document.querySelector('#recordForm [name=quantity]')?.closest('div');let service=/صيانة|تصليح|كهرباء|سمكرة|خدمات/.test(activitySelect.value);if(q)q.style.display=service?'none':'';});activitySelect.dispatchEvent(new Event('change'));}let calc=()=>{let f=document.getElementById('recordForm');let serviceMode=['consignSale','directSale'].includes(id)&&/صيانة|تصليح|كهرباء|سمكرة|خدمات/.test(f.elements.activityType?.value||'');let q=serviceMode?1:Math.max(1,Number(f.elements.quantity?.value)||1);let key=id==='purchase'?'price':id==='deposit'?'amount':'sale';let price=(id==='deposit'&&f.elements.operationType?.value==='مصروف')?Number(f.elements.expense?.value||0):Number(f.elements[key]?.value)||0;let extra=id==='purchase'?Number(f.elements.transport?.value||0)+Number(f.elements.packing?.value||0)+Number(f.elements.loading?.value||0):0;document.getElementById('lineTotalPreview').textContent=(id==='deposit'&&f.elements.operationType?.value==='مصروف'?'قيمة المصروف: ':'إجمالي الكمية: ')+money(id==='deposit'&&f.elements.operationType?.value==='مصروف'?price:q*price)+(extra?' · مع المصاريف: '+money(q*price+extra):'')};document.getElementById('recordForm').querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();document.getElementById('dlg').showModal();document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());let serviceMode=['consignSale','directSale'].includes(id)&&/صيانة|تصليح|كهرباء|سمكرة|خدمات/.test(data.activityType||'');if(serviceMode)data.quantity=1;data.section=id;data.id=rid||crypto.randomUUID();data.quantity=Math.max(1,Number(data.quantity)||1);data.unitPrice=Number(data.price??data.amount??data.sale??0);data.totalAmount=(id==='deposit'&&data.operationType==='مصروف')?Number(data.expense||data.paid||0):data.unitPrice*data.quantity;data.invoice=rid?(db.records.find(x=>x.id===rid)?.invoice||nextInvoice(id,rid)):nextInvoice(id);if(id==='deposit')data.cash='صندوق الإيداع';else if(!s.box)data.cash=data.cash||'صندوق الإيداع';else data.cash=data.cash||s.box;if(rid){let i=db.records.findIndex(x=>x.id===rid);db.records[i]={...db.records[i],...data};logActivity('تعديل سجل',s.name+' — '+(data.invoice||rid));}else{db.records.push(data);logActivity('إضافة سجل',s.name+' — '+(data.invoice||data.model||''));}save();closeForm();render()}}
function closeForm(){document.getElementById('dlg').close()}
function delRecord(id){if(activeUser.role!=='owner'){logActivity('طلب حذف','طلب الموظف حذف سجل '+id+' — يرجى مراجعة المدير');alert('الحذف متاح للمدير فقط. تم تسجيل طلبك في سجل المستخدمين.');return;}if(!confirm('هل تريد حذف العملية؟ سيتم تحديث الرصيد المحسوب للصندوق.'))return;let deleted=db.records.find(r=>r.id===id);db.records=db.records.filter(r=>r.id!==id);logActivity('حذف سجل',(deleted?.invoice||id)+' — '+(sec(deleted?.section)?.name||''));save();render()}
function openMove(){document.getElementById('formTitle').textContent='إضافة حركة صندوق';document.getElementById('formFields').innerHTML=`<div><label>الصندوق</label><select name="box">${boxes.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>نوع الحركة</label><select name="type"><option value="in">إيداع</option><option value="out">سحب</option></select></div><div><label>المبلغ بالعملة المختارة</label><input name="amount" type="number" step="0.01" required></div><div><label>التاريخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>البيان</label><input name="note"></div>`;document.getElementById('dlg').showModal();document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();db.moves.push({...Object.fromEntries(new FormData(e.target).entries()),id:crypto.randomUUID()});logActivity('حركة صندوق','إضافة حركة مالية');save();closeForm();render()}}
function openTransfer(){document.getElementById('formTitle').textContent='تحويل أموال بين الصناديق';document.getElementById('formFields').innerHTML=`<div><label>من الصندوق</label><select name="from">${boxes.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>إلى الصندوق</label><select name="to">${boxes.map(b=>`<option>${b}</option>`).join('')}</select></div><div><label>المبلغ بالعملة المختارة</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div><label>التاريخ</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>البيان</label><input name="note" placeholder="سبب التحويل"></div>`;document.getElementById('dlg').showModal();document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());if(d.from===d.to){alert('اختر صندوقين مختلفين.');return}let amount=Number(d.amount);if(!(amount>0)){alert('أدخل مبلغاً صحيحاً.');return}let transferId=crypto.randomUUID(),note='تحويل إلى '+d.to+(d.note?' · '+d.note:'');db.moves.push({id:crypto.randomUUID(),transferId,box:d.from,type:'out',amount,date:d.date,note,source:'تحويل صادر'},{id:crypto.randomUUID(),transferId,box:d.to,type:'in',amount,date:d.date,note:'تحويل من '+d.from+(d.note?' · '+d.note:''),source:'تحويل وارد'});logActivity('تحويل بين الصناديق',d.from+' → '+d.to+' · '+amount);save();closeForm();render()}}
function editMove(id){let m=db.moves.find(x=>x.id===id);if(m?.transferId){alert('هذه حركة تحويل مرتبطة بحركتها المقابلة. احذف التحويل كاملاً ثم أعد تسجيله لتجنب اختلاف الصندوقين.');return}document.getElementById('formTitle').textContent='تعديل حركة صندوق';document.getElementById('formFields').innerHTML=`<div><label>الصندوق</label><select name="box">${boxes.map(b=>`<option ${m.box===b?'selected':''}>${b}</option>`).join('')}</select></div><div><label>نوع الحركة</label><select name="type"><option value="in" ${m.type==='in'?'selected':''}>إيداع</option><option value="out" ${m.type==='out'?'selected':''}>سحب</option></select></div><div><label>المبلغ بالعملة المختارة</label><input name="amount" type="number" step="0.01" value="${m.amount}" required></div><div><label>التاريخ</label><input name="date" type="date" value="${m.date}"></div><div class="field full"><label>البيان</label><input name="note" value="${m.note||''}"></div>`;document.getElementById('dlg').showModal();document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();Object.assign(m,Object.fromEntries(new FormData(e.target).entries()));save();closeForm();render()}}
function delMove(id){if(confirm('حذف حركة الصندوق؟')){let m=db.moves.find(x=>x.id===id);db.moves=db.moves.filter(x=>m?.transferId?x.transferId!==m.transferId:x.id!==id);save();render()}}

function usersPage(el){if(activeUser.role!=='owner'){el.innerHTML='<div class="notice">إدارة المستخدمين متاحة للمالك فقط.</div>';return}el.innerHTML=`<div class="headrow"><div><h1>إدارة المستخدمين والصلاحيات</h1><div class="muted">أنشئ حساباً لكل موظف وحدد الأقسام التي يمكنه الوصول إليها</div></div><div class="right"><button class="btn secondary" onclick="ownerPassword()">تغيير كلمة مرور المالك</button><button class="btn" onclick="userForm()">＋ إضافة مستخدم</button></div></div><div class="notice">الحسابات محفوظة محلياً في هذا المتصفح. لا تستخدم كلمات مرور حساسة في هذه النسخة التجريبية، ولا تمنحها صلاحية حماية فعلية على خادم مشترك.</div><div class="panel" style="margin-top:14px"><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>نوع الحساب</th><th>الصلاحيات</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${users.map(u=>`<tr><td>${u.name}</td><td>${u.username}</td><td>${u.role==='owner'?'المالك':'موظف'}</td><td>${u.role==='owner'?'كامل الصلاحيات':u.permissions.map(p=>PERMS.find(x=>x[0]===p)?.[1]).filter(Boolean).join('، ')||'لا توجد'}</td><td>${u.active?'فعال':'موقوف'}</td><td><div class="act">${u.role!=='owner'?`<button class="btn secondary small" onclick="userForm('${u.id}')">تعديل</button><button class="btn danger small" onclick="deleteUser('${u.id}')">حذف</button>`:'حساب المالك'}</div></td></tr>`).join('')}</tbody></table></div></div>`}
function userForm(id=null){if(activeUser.role!=='owner')return;let u=id?users.find(x=>x.id===id):{name:'',username:'',password:'',permissions:['dashboard'],active:true};document.getElementById('formTitle').textContent=id?'تعديل مستخدم وصلاحياته':'إضافة مستخدم جديد';document.getElementById('formFields').innerHTML=`<div><label>اسم الموظف</label><input name="name" required value="${u.name}"></div><div><label>اسم المستخدم</label><input name="username" required value="${u.username}"></div><div><label>${id?'كلمة مرور جديدة (اتركها فارغة للإبقاء عليها)':'كلمة المرور'}</label><input name="password" type="password" ${id?'':'required'}></div><div><label>حالة الحساب</label><select name="active"><option value="true" ${u.active?'selected':''}>فعال</option><option value="false" ${!u.active?'selected':''}>موقوف</option></select></div><div class="field full"><label>الصلاحيات المسموحة</label><div class="formgrid">${PERMS.filter(x=>!['users','activityLog'].includes(x[0])).map(([k,n])=>`<label style="display:flex;gap:8px;align-items:center"><input style="width:auto" type="checkbox" name="perm_${k}" ${u.permissions.includes(k)?'checked':''}> ${n}</label>`).join('')}</div></div>`;document.getElementById('dlg').showModal();document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),username=String(fd.get('username')).trim();if(users.some(x=>x.username===username&&x.id!==id)){alert('اسم المستخدم مستخدم مسبقاً');return}let permissions=PERMS.filter(([k])=>fd.get('perm_'+k)).map(x=>x[0]);let data={name:String(fd.get('name')).trim(),username,password:String(fd.get('password')||''),permissions,active:fd.get('active')==='true',role:'staff'};if(id){let old=users.find(x=>x.id===id);if(!data.password)data.password=old.password;Object.assign(old,data);logActivity('تعديل مستخدم',data.username);}else{users.push({...data,id:crypto.randomUUID()});logActivity('إضافة مستخدم',data.username);}saveUsers();closeForm();render()}}
function ownerPassword(){let old=prompt('أدخل كلمة مرور المالك الحالية');if(old!==users.find(u=>u.role==='owner')?.password){alert('كلمة المرور الحالية غير صحيحة');return}let next=prompt('أدخل كلمة المرور الجديدة');if(!next||next.length<6){alert('يجب أن تكون كلمة المرور 6 أحرف على الأقل');return}let owner=users.find(u=>u.role==='owner');owner.password=next;saveUsers();alert('تم تحديث كلمة مرور المالك على هذا المتصفح.')}
function deleteUser(id){if(confirm('هل تريد حذف حساب هذا المستخدم؟')){let u=users.find(x=>x.id===id);users=users.filter(u=>u.id!==id);logActivity('حذف مستخدم',u?.username||id);saveUsers();render()}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'AIB-backup.json')}
function exportCSV(){let rows=[['القسم','التاريخ','الموديل','السنة','القيمة','الدفعة','الصندوق','التفاصيل','الفاتورة'],...db.records.map(r=>[sec(r.section).name,r.date,r.model,r.year,r.amount??r.price??r.sale,r.paid,boxFor(r),r.details,r.invoice])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'AIB-report.csv')}

function applyLanguage(){let sel=document.getElementById('languageSelect');if(sel)sel.value=appLanguage;let cur=document.getElementById('currencySelect');if(cur)cur.value=currency;document.documentElement.lang=appLanguage;document.documentElement.dir=appLanguage==='en'?'ltr':'rtl';if(appLanguage!=='en')return;let walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(let n of nodes){let t=n.nodeValue.trim();if(!t)continue;let out=n.nodeValue;for(let [ar,en] of Object.entries(englishMap)){if(out.includes(ar))out=out.split(ar).join(en);}n.nodeValue=out;}document.querySelectorAll('input,textarea').forEach(el=>{if(el.placeholder){for(let [ar,en] of Object.entries(englishMap))el.placeholder=el.placeholder.split(ar).join(en);}});}
