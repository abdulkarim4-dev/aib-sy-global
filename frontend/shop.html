<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121820"><title>متجر AIB | التسوق</title>
<style>
:root{--bg:#10151b;--panel:#1b242e;--line:#344656;--blue:#2476b9;--blue2:#3999df;--silver:#d0d8df;--orange:#e87936;--muted:#aebbc7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#1c3850 0,transparent 38%),var(--bg);color:#f5f7f9;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,92%);margin:auto}.top{min-height:96px;height:auto;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30404e}.brand{display:flex;gap:12px;align-items:center}.brand img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:15px;padding:2px;flex:0 0 auto;filter:drop-shadow(0 5px 12px #0006)}.brand b{letter-spacing:2px}.brand small{display:block;color:#9eabb7;font-size:11px;margin-top:4px}.btn{border:1px solid #3b8bc5;background:linear-gradient(135deg,#267cbb,#17517e);color:white;padding:11px 17px;border-radius:10px;font-weight:bold;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#222d37;border-color:#526270}.top .home-link{flex:0 0 auto;padding:9px 13px;font-size:12px;line-height:1.35;border-radius:9px;white-space:nowrap}.hero{margin:24px 0;border-radius:20px;border:1px solid #38546b;padding:32px;background:linear-gradient(90deg,#111a22f5,#111a22c9),url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1600&q=85') center/cover}.hero h1{font-size:clamp(27px,4vw,43px);margin:0 0 10px}.hero p{color:#c2ccd4;line-height:1.9}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{background:#18232d;border:1px solid #40566a;color:#fff;border-radius:10px;padding:12px;min-width:160px;flex:1}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.cat{background:#1b2834;border:1px solid #3c5367;border-radius:11px;padding:13px;text-align:center;color:#d7e6f1;cursor:pointer}.cat.active,.cat:hover{background:#1d5f91;border-color:#4ba4e5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.product{border:1px solid #354b5e;background:linear-gradient(145deg,#202c37,#151e26);border-radius:14px;padding:16px}.sku{font-size:11px;color:#71b9ed;direction:ltr;text-align:right}.product h3{font-size:15px;margin:10px 0}.product p{color:#afbdc8;font-size:12px;margin:6px 0}.stock{color:#c8d3dc}.price{color:#f2a16a;font-weight:bold;margin-top:12px}.product-media{height:190px;background:#101820;border:1px solid #344656;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.main-photo{width:100%;height:100%;object-fit:contain}.no-photo{color:#718394;font-size:12px}.thumbs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.thumbs img{width:48px;height:42px;object-fit:cover;border:1px solid #526779;border-radius:6px;cursor:pointer;flex:0 0 auto}.details{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.details span{background:#17232d;border-radius:7px;padding:7px;font-size:11px;color:#b8c6d1}.details b{color:#f4f7fa}.category-label{display:inline-block;color:#83c5f3;background:#17344a;border-radius:20px;padding:4px 9px;font-size:10px;margin-top:7px}.price{font-size:16px}.product .stock{margin-top:10px}..empty{grid-column:1/-1;text-align:center;border:1px dashed #4a6173;padding:30px;border-radius:12px;color:#b7c4ce}.foot{margin:35px 0 0;padding:20px 0;border-top:1px solid #30404e;color:#9baab6;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.top{min-height:76px;height:auto;gap:8px}.brand{gap:8px;min-width:0}.brand img{width:58px;height:58px}.brand b{font-size:14px}.brand small{font-size:9px}.top .home-link{padding:7px 9px;font-size:10px;border-radius:8px;max-width:116px;white-space:normal;text-align:center;line-height:1.35}.grid{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}}
</style></head><body><header class="wrap top"><div class="brand"><img src="/logo.jpg?v=20261107" alt="AIB"><div><b>AIB GROUP</b><small>المتجر الإلكتروني الرسمي</small></div></div><a class="btn secondary home-link" href="/" aria-label="العودة إلى الواجهة الرئيسية">الواجهة الرئيسية</a></header><main class="wrap"><section class="hero"><div style="color:#72b9ec;font-size:12px;letter-spacing:2px;font-weight:bold">AIB ONLINE STORE</div><h1>تسوّق من مجموعة AIB</h1><p>اكتشف قطع الغيار والمحركات والسيارات والشاحنات والمعدات الثقيلة المتوفرة في مخزون الشركة.</p></section><div class="tools"><input id="q" placeholder="ابحث باسم المنتج أو رقم القطعة أو الموديل" oninput="load()"><select id="sort" onchange="load()"><option value="">ترتيب افتراضي</option><option value="name">الاسم</option><option value="stock">الكمية المتوفرة</option></select></div><div class="cats"><button class="cat active" onclick="category('',this)">الكل</button><button class="cat" onclick="category('parts',this)">قطع الغيار</button><button class="cat" onclick="category('engines',this)">المحركات</button><button class="cat" onclick="category('cars',this)">السيارات</button><button class="cat" onclick="category('trucks',this)">الشاحنات</button><button class="cat" onclick="category('heavy',this)">المعدات الثقيلة</button></div><h2>المنتجات المتاحة</h2><div id="grid" class="grid"><div class="empty">جارٍ تحميل المنتجات…</div></div><footer class="foot">مجموعة AIB التجارية · للاستفسار والشراء تواصل عبر <a href="https://wa.me/963997439627" style="color:#70b9ed">واتساب +963997439627</a></footer></main><script>
let selected='';function category(c,b){selected=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){return Number(v||0).toLocaleString('ar-SY',{maximumFractionDigits:2})}
function categoryName(c){return ({parts:'قطع الغيار',engines:'المحركات',cars:'السيارات',trucks:'الشاحنات',heavy:'المعدات الثقيلة'})[c]||'منتجات AIB'}function productCard(x){const imgs=Array.isArray(x.images)?x.images:[];const first=imgs[0]||'';const media=first?'<div class="product-media"><img class="main-photo" src="'+esc(first)+'" alt="'+esc(x.name)+'"></div>':'<div class="product-media"><span class="no-photo">لا توجد صورة مضافة لهذا المنتج</span></div>';const thumbs=imgs.length>1?'<div class="thumbs">'+imgs.map((src,i)=>'<img src="'+esc(src)+'" alt="صورة '+(i+1)+'" onclick="this.closest(\'.product\').querySelector(\'.main-photo\').src=this.src">').join('')+'</div>':'';return '<article class="product">'+media+thumbs+'<div class="sku">SKU: '+esc(x.sku)+'</div><span class="category-label">'+categoryName(x.category)+'</span><h3>'+esc(x.name)+'</h3><p>الموديل: '+esc(x.model||'—')+'</p><div class="details"><span>المخزون المملوك: <b>'+fmt(x.owned_stock)+'</b></span><span>مخزون الأمانة: <b>'+fmt(x.consigned_stock)+'</b></span></div><p class="stock">إجمالي الكمية المتوفرة: <b>'+fmt(x.stock)+'</b></p><div class="price">'+(x.sale_price?fmt(x.sale_price)+' '+esc(x.currency):'السعر عند التواصل')+'</div><p>عدد الصور: '+imgs.length+'/20</p></article>'}async function load(){let g=document.getElementById('grid');try{let p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(selected)p.set('category',selected);let r=await fetch('/public/products?'+p);if(!r.ok)throw Error();let a=await r.json();if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ar'));if(sort.value==='stock')a.sort((x,y)=>y.stock-x.stock);g.innerHTML=a.length?a.map(productCard).join(''):'<div class="empty">لا توجد منتجات متاحة في هذا القسم حالياً.</div>'}catch(e){g.innerHTML='<div class="empty">تعذر تحميل المنتجات حالياً.</div>'}}load();
</script></body></html>
