<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121820"><title>متجر AIB | التسوق</title>
<style>
:root{--bg:#10151b;--panel:#1b242e;--line:#344656;--blue:#2476b9;--blue2:#3999df;--silver:#d0d8df;--orange:#e87936;--muted:#aebbc7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#1c3850 0,transparent 38%),var(--bg);color:#f5f7f9;font-family:Tahoma,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,92%);margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30404e}.brand{display:flex;gap:12px;align-items:center}.brand img{width:49px;height:49px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}.brand b{letter-spacing:2px}.brand small{display:block;color:#9eabb7;font-size:11px;margin-top:4px}.btn{border:1px solid #3b8bc5;background:linear-gradient(135deg,#267cbb,#17517e);color:white;padding:11px 17px;border-radius:10px;font-weight:bold;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:#222d37;border-color:#526270}.top .home-link{flex:0 0 auto;padding:9px 13px;font-size:12px;line-height:1.35;border-radius:9px;white-space:nowrap}.hero{margin:24px 0;border-radius:20px;border:1px solid #38546b;padding:32px;background:linear-gradient(90deg,#111a22f5,#111a22c9),url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=1600&q=85') center/cover}.hero h1{font-size:clamp(27px,4vw,43px);margin:0 0 10px}.hero p{color:#c2ccd4;line-height:1.9}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tools input,.tools select{background:#18232d;border:1px solid #40566a;color:#fff;border-radius:10px;padding:12px;min-width:160px;flex:1}.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.cat{background:#1b2834;border:1px solid #3c5367;border-radius:11px;padding:13px;text-align:center;color:#d7e6f1;cursor:pointer}.cat.active,.cat:hover{background:#1d5f91;border-color:#4ba4e5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.product{border:1px solid #354b5e;background:linear-gradient(145deg,#202c37,#151e26);border-radius:14px;padding:16px}.sku{font-size:11px;color:#71b9ed;direction:ltr;text-align:right}.product h3{font-size:15px;margin:10px 0}.product p{color:#afbdc8;font-size:12px;margin:6px 0}.stock{color:#c8d3dc}.price{color:#f2a16a;font-weight:bold;margin-top:12px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #4a6173;padding:30px;border-radius:12px;color:#b7c4ce}.foot{margin:35px 0 0;padding:20px 0;border-top:1px solid #30404e;color:#9baab6;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.top{height:66px;gap:8px}.brand{gap:8px;min-width:0}.brand img{width:38px;height:38px}.brand b{font-size:14px}.brand small{font-size:9px}.top .home-link{padding:7px 9px;font-size:10px;border-radius:8px;max-width:116px;white-space:normal;text-align:center;line-height:1.35}.grid{grid-template-columns:1fr 1fr}.cats{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}}
</style></head><body><header class="wrap top"><div class="brand"><img src="/logo.png" alt="AIB"><div><b>AIB GROUP</b><small>المتجر الإلكتروني الرسمي</small></div></div><a class="btn secondary home-link" href="/" aria-label="العودة إلى الواجهة الرئيسية">الواجهة الرئيسية</a></header><main class="wrap"><section class="hero"><div style="color:#72b9ec;font-size:12px;letter-spacing:2px;font-weight:bold">AIB ONLINE STORE</div><h1>تسوّق من مجموعة AIB</h1><p>اكتشف قطع الغيار والمحركات والسيارات والشاحنات والمعدات الثقيلة المتوفرة في مخزون الشركة.</p></section><div class="tools"><input id="q" placeholder="ابحث باسم المنتج أو رقم القطعة أو الموديل" oninput="load()"><select id="sort" onchange="load()"><option value="">ترتيب افتراضي</option><option value="name">الاسم</option><option value="stock">الكمية المتوفرة</option></select></div><div class="cats"><button class="cat active" onclick="category('',this)">الكل</button><button class="cat" onclick="category('parts',this)">قطع الغيار</button><button class="cat" onclick="category('engines',this)">المحركات</button><button class="cat" onclick="category('cars',this)">السيارات</button><button class="cat" onclick="category('trucks',this)">الشاحنات</button><button class="cat" onclick="category('heavy',this)">المعدات الثقيلة</button></div><h2>المنتجات المتاحة</h2><div id="grid" class="grid"><div class="empty">جارٍ تحميل المنتجات…</div></div><footer class="foot">مجموعة AIB التجارية · للاستفسار والشراء تواصل عبر <a href="https://wa.me/963997439627" style="color:#70b9ed">واتساب +963997439627</a></footer></main><script>
let selected='';function category(c,b){selected=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){return Number(v||0).toLocaleString('ar-SY',{maximumFractionDigits:2})}
async function load(){let g=document.getElementById('grid');try{let p=new URLSearchParams();if(q.value.trim())p.set('q',q.value.trim());if(selected)p.set('category',selected);let r=await fetch('/public/products?'+p);if(!r.ok)throw Error();let a=await r.json();if(sort.value==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ar'));if(sort.value==='stock')a.sort((x,y)=>y.stock-x.stock);g.innerHTML=a.length?a.map(x=>'<article class="product"><div class="sku">'+esc(x.sku)+'</div><h3>'+esc(x.name)+'</h3><p>'+esc(x.model||'')+'</p><p class="stock">الكمية المتوفرة: <b>'+fmt(x.stock)+'</b></p><div class="price">'+(x.sale_price?fmt(x.sale_price)+' '+esc(x.currency):'السعر عند التواصل')+'</div></article>').join(''):'<div class="empty">لا توجد منتجات متاحة في هذا القسم حالياً.</div>'}catch(e){g.innerHTML='<div class="empty">تعذر تحميل المنتجات حالياً.</div>'}}load();
</script></body></html>
