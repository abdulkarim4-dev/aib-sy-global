async function requestOperationVerification(action){
 const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;
 const startResponse=await fetch(API+'/operation-verifications/start',{method:'POST',headers,body:JSON.stringify({action})});
 let startData={};try{startData=await startResponse.json()}catch{}
 if(!startResponse.ok)throw new Error(startData.detail||'تعذر إرسال رمز تأكيد العملية');
 if(!startData.required)return null;
 const code=await aibPrompt('أرسلنا رمز تأكيد من 6 أرقام إلى بريدك الإلكتروني '+(startData.email||'الموثق')+' أدخل الرمز لإتمام العملية. لن يتم حفظ العملية قبل التحقق.',{title:'تأكيد العملية عبر البريد الإلكتروني',placeholder:'أدخل رمز التحقق المكوّن من 6 أرقام'});
 if(code===null)throw new Error('تم إلغاء العملية قبل التأكيد');
 const clean=String(code).trim();if(!/^\d{6}$/.test(clean))throw new Error('أدخل رمز التحقق المكوّن من 6 أرقام');
 const verifyResponse=await fetch(API+'/operation-verifications/confirm',{method:'POST',headers,body:JSON.stringify({challenge_id:startData.challenge_id,code:clean})});
 let verifyData={};try{verifyData=await verifyResponse.json()}catch{}
 if(!verifyResponse.ok)throw new Error(verifyData.detail||'تعذر تأكيد رمز البريد الإلكتروني');
 return verifyData.verification_token;
}
function operationActionForRequest(path,method){
 if(method!=='POST')return null;
 if(path==='/records')return 'invoice_create';
 if(/^\/records\/\d+\/payments$/.test(path))return 'invoice_payment';
 if(path==='/cash-movements')return 'cash_movement';
 if(path==='/cash-transfers')return 'cash_transfer';
 return null;
}
async function api(path,opts={}){
 let h={...(opts.headers||{})};if(token)h.Authorization='Bearer '+token;
 const method=String(opts.method||'GET').toUpperCase();
 if(opts.body){
  let body=opts.body;
  const action=operationActionForRequest(path,method);
  if(action&&body&&typeof body==='object'&&!Array.isArray(body)){
   const grant=await requestOperationVerification(action);
   if(grant)body={...body,verification_token:grant};
  }
  h['Content-Type']='application/json';opts.body=JSON.stringify(body);
 }
 let r=await fetch(API+path,{...opts,headers:h});let data;try{data=await r.json()}catch{data={}}
 if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));return data
}

function logout(){token='';me=null;records=[];sessionStorage.removeItem('aib_current_page');sessionStorage.removeItem('aib_session_token');localStorage.removeItem('aib_remembered_token');document.getElementById('rememberMe').checked=false;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return Number(v||0).toLocaleString(lang==='ar'?'ar-SY':'en-US',{maximumFractionDigits:2})}function go(p,b){currentPage=p;sessionStorage.setItem('aib_current_page',p);document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));renderPage(p)}

else if(p==='users'){users=await api('/users');c.innerHTML=`<div class="page-head"><h2>${tr('users')}</h2></div><section class="card"><h3>${tr('createUser')}</h3><div class="notice">الحساب الجديد يبدأ دون صلاحيات. بعد إنشائه اضغط «إدارة الصلاحيات» وحدد الأقسام والعمليات المسموحة له.</div><form id="userForm"><div class="form-grid"><div class="field"><label>${tr('newUser')}</label><input name="username" minlength="3" required></div><div class="field"><label>${tr('name')}</label><input name="full_name" required></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>${tr('newPass')}</label><input name="password" type="password" minlength="12" required></div></div><button class="btn">${tr('createUser')}</button></form></section><section class="card"><h3>${tr('users')}</h3>${tableUsers(users)}</section>`;document.getElementById('userForm').onsubmit=saveUser}
else if(p==='onlineOrders'){if(me.role!=='owner')throw new Error('هذه الصفحة متاحة للمالك فقط');const orders=await api('/online-purchase-orders');const pending=orders.filter(o=>o.status==='pending').length;const badge=document.getElementById('onlineOrderCountBadge');if(badge){badge.textContent=pending;badge.classList.toggle('hidden',pending===0)}c.innerHTML='<div class="page-head"><h2>طلبات الشراء عبر الإنترنت</h2><button class="btn secondary" onclick="renderPage(\'onlineOrders\')">تحديث</button></div><div class="notice">لا تُسجّل المبيعات ولا يُخصم المخزون إلا بعد اعتماد إثبات الدفع. بعد الاعتماد تُنشأ فاتورة البيع في السجلات.</div>'+onlineOrdersHtml(orders)}else if(p==='companyProfile'){companyProfile=await api('/company-profile');c.innerHTML=companyProfileFormHtml();document.getElementById('profileDocType').addEventListener('change',syncProfileDoc);document.getElementById('companyProfileForm').onsubmit=saveCompanyProfile}else if(p==='requests'){requests=me.role==='owner'?await api('/change-requests'):await api('/my-change-requests');if(me.role!=='owner')await load();c.innerHTML=`<div class="page-head"><h2>${tr('requests')}</h2></div>${tableRequests(requests)}`}

async function refreshOnlineOrderBadge(){if(me?.role!=='owner')return;try{const rows=await api('/online-purchase-orders');const n=rows.filter(x=>x.status==='pending').length;const b=document.getElementById('onlineOrderCountBadge');if(b){b.textContent=n;b.classList.toggle('hidden',n===0)}}catch(e){}}
function onlineOrdersHtml(rows){if(!rows.length)return '<div class="empty">لا توجد طلبات شراء حتى الآن.</div>';window.onlineOrderProofs=Object.fromEntries(rows.map(o=>[o.id,{data:o.payment_proof||'',type:o.proof_type||''}]));return rows.map(o=>{const d=o.customer||{},pending=o.status==='pending',proof=o.payment_proof||'',proofLink=proof.startsWith('data:')?'<button type="button" class="btn secondary" onclick="openOnlineOrderProof('+o.id+')">عرض إثبات الدفع</button>':'';const phone=(d.full_phone||'').replace(/[^0-9]/g,'');const items=(o.items||[]).map(x=>'<tr><td>'+esc(x.description)+'<br><small>'+esc(x.sku)+'</small></td><td>'+fmt(x.quantity)+'</td><td>'+fmt(x.price)+' '+esc(o.currency)+'</td></tr>').join('');return '<section class="card"><div class="page-head"><h3>طلب #'+o.id+' · '+(pending?'<span class="tag">بانتظار التحقق</span>':o.status==='approved'?'<span class="tag">معتمد</span>':'<span class="tag">مرفوض</span>')+'</h3><span class="muted small">'+new Date(o.created_at).toLocaleString()+'</span></div><div class="grid"><div><b>العميل</b><p>'+esc(d.full_name||'')+'</p></div><div><b>الهاتف</b><p dir="ltr">'+esc(d.full_phone||'')+'</p></div><div><b>البريد</b><p>'+esc(d.email||'')+'</p></div><div><b>عنوان الشحن</b><p>'+esc(d.shipping_address||'')+'</p></div></div><div class="table-wrap"><table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th></tr></thead><tbody>'+items+'</tbody></table></div><p><b>الإجمالي: '+fmt(o.total)+' '+esc(o.currency)+'</b></p><div class="actions">'+proofLink+(o.status==='approved'&&o.record_id?'<button class="btn secondary" onclick="printOnlineOrderInvoice('+o.record_id+')">عرض الفاتورة الأصلية</button><button class="btn" onclick="sendOnlineOrderWhatsapp('+o.id+',\''+phone+'\','+o.record_id+')">إرسال الفاتورة عبر واتساب</button>':'')+(pending?'<button class="btn success" onclick="reviewOnlineOrder('+o.id+',\'approve\')">اعتماد الدفع وإصدار الفاتورة</button><button class="btn danger" onclick="reviewOnlineOrder('+o.id+',\'reject\')">رفض الإثبات</button>':'')+'</div>'+(o.review_note?'<p class="muted">ملاحظة: '+esc(o.review_note)+'</p>':'')+'</section>'}).join('')}
function closeOnlineOrderProof(){document.getElementById('onlineProofModal')?.remove()}function openOnlineOrderProof(id){const proof=window.onlineOrderProofs?.[id];if(!proof?.data?.startsWith('data:')){aibAlert('إثبات الدفع غير متوفر لهذا الطلب');return}closeOnlineOrderProof();const modal=document.createElement('div');modal.id='onlineProofModal';modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(8,17,25,.88);display:flex;align-items:center;justify-content:center;padding:14px';const panel=document.createElement('div');panel.style.cssText='width:min(100%,900px);height:min(92vh,900px);background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)';const bar=document.createElement('div');bar.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#172b3b;color:#fff;font-weight:800';bar.innerHTML='<span>إثبات الدفع · الطلب #'+id+'</span>';const close=document.createElement('button');close.type='button';close.textContent='إغلاق';close.style.cssText='border:1px solid #ffffff66;border-radius:8px;background:#ffffff18;color:#fff;padding:7px 14px;font-weight:700';close.onclick=closeOnlineOrderProof;bar.appendChild(close);panel.appendChild(bar);if(proof.data.startsWith('data:image/')){const img=document.createElement('img');img.src=proof.data;img.alt='إثبات الدفع';img.style.cssText='width:100%;height:100%;object-fit:contain;background:#e9edf1';panel.appendChild(img)}else{const frame=document.createElement('iframe');frame.src=proof.data;frame.title='إثبات الدفع PDF';frame.style.cssText='width:100%;height:100%;border:0;background:#fff';panel.appendChild(frame)}modal.appendChild(panel);modal.addEventListener('click',e=>{if(e.target===modal)closeOnlineOrderProof()});document.addEventListener('keydown',function escProof(e){if(e.key==='Escape'){closeOnlineOrderProof();document.removeEventListener('keydown',escProof)}});document.body.appendChild(modal)}
async function reviewOnlineOrder(id,action){let note='';if(action==='reject'){note=(await aibPrompt('اكتب سبب رفض إثبات الدفع للطلب رقم '+id+':',{title:'رفض إثبات الدفع',placeholder:'سبب الرفض',multiline:true}))||'إثبات الدفع غير مقبول';if(!await aibConfirm('تأكيد رفض الطلب رقم '+id+'؟','تأكيد رفض الطلب',true))return}else if(!await aibConfirm('هل تحققت بنفسك من وصول المبلغ في شام كاش وتريد اعتماد الطلب وإنشاء فاتورة بيع وخصم المخزون؟','اعتماد الدفع وإصدار الفاتورة',false))return;try{const result=await api('/online-purchase-orders/'+id+'/review',{method:'POST',body:{action,note}});if(action==='approve')aibAlert('تم اعتماد الدفع وإنشاء فاتورة رقم '+result.invoice_no+' وتحديث المخزون.');await renderPage('onlineOrders');await refreshOnlineOrderBadge()}catch(e){aibAlert(e.message)}}

function sendOnlineOrderWhatsapp(orderId,phone,recordId){if(!phone){aibAlert('رقم هاتف العميل غير متوفر');return}const message='مرحباً، تم اعتماد طلب الشراء رقم #'+orderId+' وإصدار فاتورة AIB الأصلية. سأرسل إليك ملف الفاتورة PDF في رسالة منفصلة بعد إرفاقه.';aibAlert('تنبيه: واتساب أعمال العادي لا يسمح بإرفاق ملف تلقائياً عبر رابط المحادثة. افتح الفاتورة الأصلية أولاً واحفظها بصيغة PDF، ثم أرفق الملف يدوياً داخل واتساب قبل إرسال الرسالة.');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(message),'_blank','noopener')}
function inventoryTable(rows){if(!rows.length)return '<div class="empty">لا توجد قطع مسجلة في المخزون</div>';return '<div class="table-wrap"><table><thead><tr><th>رقم القطعة SKU</th><th>اسم القطعة</th><th>الموديل</th><th>المخزون المملوك</th><th>مخزون الأمانة</th><th>سعر الشراء</th><th>سعر البيع (+35%)</th><th>العملة</th><th>أجور الشحن داخل سوريا</th><th>صور المنتج</th></tr></thead><tbody>'+rows.map(p=>'<tr><td dir="ltr">'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.model||'—')+'</td><td>'+fmt(p.owned_stock)+'</td><td>'+fmt(p.consigned_stock)+'</td><td>'+fmt(p.purchase_price||0)+'</td><td><b style="color:#e6b95e">'+fmt(p.sale_price||0)+'</b></td><td>'+esc(p.currency||'—')+'</td><td>'+(hasPerm('inventory','edit')?'<label style="display:flex;align-items:center;gap:6px;white-space:nowrap;color:#198754;font-weight:700"><input type="checkbox" '+(p.shipping_included?'checked':'')+' onchange="setInventoryShipping('+p.id+',this.checked)" style="accent-color:#198754;width:17px;height:17px"> السعر شامل الشحن داخل سوريا</label>':(p.shipping_included?'<span style="color:#198754;font-weight:700">شامل الشحن داخل سوريا</span>':'—'))+'</td><td>'+(me?.role==='owner'?'<button class="btn secondary" onclick="openInventoryImages('+p.id+')">الصور ('+(p.images||[]).length+'/20)</button>':'صور: '+(p.images||[]).length)+'</td></tr>').join('')+'</tbody></table></div>'}window.inventoryImageDraft=[];
function renderInventoryImageModal(){const draft=window.inventoryImageDraft||[];document.getElementById('modalTitle').textContent='صور المنتج · '+draft.length+'/20';document.getElementById('modalBody').innerHTML='<p class="muted">يمكن إضافة حتى 20 صورة لكل قطعة. الصور تحفظ مع بيانات المنتج.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin:14px 0">'+draft.map((src,i)=>'<div style="position:relative;border:1px solid var(--border,#ccd4dc);border-radius:10px;padding:6px"><img src="'+src+'" style="width:100%;height:95px;object-fit:contain;border-radius:7px"><button class="btn danger" style="width:100%;margin-top:5px;padding:6px" onclick="removeInventoryImage('+i+')">حذف</button></div>').join('')+'</div><label class="btn secondary" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">إضافة صور <input id="inventoryImageFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" onchange="addInventoryImages(this.files)"></label><div class="actions" style="margin-top:16px"><button class="btn" onclick="saveInventoryImages()">حفظ الصور</button><button class="btn secondary" onclick="closeModal()">إغلاق</button></div>';}

function compressInventoryImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('تعذرت قراءة إحدى الصور'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('ملف صورة غير صالح'));img.onload=()=>{const scale=Math.min(1,1400/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let quality=.82;let data=canvas.toDataURL('image/jpeg',quality);while(data.length>1350000&&quality>.45){quality-=.08;data=canvas.toDataURL('image/jpeg',quality)}if(data.length>1400000)return reject(new Error('حجم الصورة كبير؛ اختر صورة أصغر'));resolve(data)};img.src=reader.result};reader.readAsDataURL(file)})}

'shipping_cost'].reduce((a,k)=>a+Number(document.querySelector('[name="'+k+'"]')?.value||0),0);const e=document.getElementById('extraCostsTotal'),i=document.getElementById('itemsSubtotal'),t=document.getElementById('invoiceAmount');if(e)e.textContent=fees.toFixed(2);if(i)i.textContent=sub.toFixed(2);if(t)t.value=(sub+fees).toFixed(2);return {sub,fees,total:sub+fees}}function addItemRow(){window.draftItems=window.draftItems||[];window.draftItems.push({sku:'',description:'',model:'',chassis:'',year:'',quantity:1,price:''});renderItemRows()}function removeItemRow(i){if((window.draftItems||[]).length<=1)return;window.draftItems.splice(i,1);renderItemRows()}function collectItemRows(){return (window.draftItems||[]).map(x=>({sku:String(x.sku||'').trim().toUpperCase(),description:String(x.description||'').trim(),model:String(x.model||'').trim(),chassis:String(x.chassis||'').trim(),year:x.year?Number(x.year):null,quantity:Number(x.quantity||0),price:Number(x.price||0)})).filter(x=>x.description||x.model||x.quantity||x.price)}

function aibDialog(message,{title='تنبيه من مجموعة AIB',confirm=false,danger=false}={}){return new Promise(resolve=>{const root=document.getElementById('aibDialog'),titleEl=document.getElementById('aibDialogTitle'),messageEl=document.getElementById('aibDialogMessage'),actions=document.getElementById('aibDialogActions');titleEl.textContent=title;messageEl.textContent=String(message??'');root.dir=lang==='ar'?'rtl':'ltr';actions.innerHTML='';const finish=value=>{root.classList.add('hidden');document.removeEventListener('keydown',onKey);resolve(value)};const onKey=e=>{if(e.key==='Escape')finish(false);if(e.key==='Enter'&&confirm)finish(true)};const cancel=document.createElement('button');cancel.className='btn secondary';cancel.type='button';cancel.textContent=confirm?(lang==='ar'?'رجوع':'Cancel'):(lang==='ar'?'إغلاق':'Close');cancel.onclick=()=>finish(false);actions.appendChild(cancel);if(confirm){const ok=document.createElement('button');ok.className='btn '+(danger?'aib-confirm-danger':'aib-confirm-main');ok.type='button';ok.textContent=lang==='ar'?(danger?'نعم، متابعة':'تأكيد'):'Confirm';ok.onclick=()=>finish(true);actions.appendChild(ok)}root.classList.remove('hidden');document.addEventListener('keydown',onKey);cancel.focus()})}function aibConfirm(message,title='تأكيد العملية',danger=true){return aibDialog(message,{title,confirm:true,danger})}function aibPrompt(message,{title='إدخال البيانات',placeholder='',initial='',multiline=false,numeric=false}={}){return new Promise(resolve=>{const root=document.getElementById('aibDialog'),titleEl=document.getElementById('aibDialogTitle'),messageEl=document.getElementById('aibDialogMessage'),actions=document.getElementById('aibDialogActions');titleEl.textContent=title;messageEl.textContent=String(message??'');root.dir=lang==='ar'?'rtl':'ltr';actions.innerHTML='';const field=document.createElement(multiline?'textarea':'input');field.className='aib-dialog-input';field.placeholder=placeholder;field.value=String(initial??'');if(multiline){field.rows=5;field.style.resize='vertical'}else{field.type='text';if(numeric){field.inputMode='numeric';field.pattern='[0-9]{6}';field.maxLength=6;field.autocomplete='one-time-code';field.dir='ltr';field.style.textAlign='center';field.style.letterSpacing='8px';field.style.fontSize='22px'}}messageEl.after(field);const finish=value=>{field.remove();root.classList.add('hidden');document.removeEventListener('keydown',onKey);resolve(value)};const onKey=e=>{if(e.key==='Escape')finish(null);if(e.key==='Enter'&&!multiline){e.preventDefault();finish(field.value)}};const cancel=document.createElement('button');cancel.className='btn secondary';cancel.type='button';cancel.textContent=lang==='ar'?'إلغاء':'Cancel';cancel.onclick=()=>finish(null);actions.appendChild(cancel);const ok=document.createElement('button');ok.className='btn aib-confirm-main';ok.type='button';ok.textContent=lang==='ar'?'تأكيد الرمز':'Confirm code';ok.onclick=()=>finish(field.value);actions.appendChild(ok);root.classList.remove('hidden');document.addEventListener('keydown',onKey);field.focus()})}function aibAlert(message,title='تنبيه من مجموعة AIB'){return aibDialog(message,{title})}function closeModal(){document.getElementById('modal').classList.add('hidden')}async function voidCashMove(id){if(!await aibConfirm('سيتم إلغاء الحركة واستبعادها من الرصيد. هل تريد المتابعة؟','تأكيد إلغاء الحركة'))return;try{await api('/cash-movements/'+id+'/void',{method:'PATCH'});await renderPage('cash')}catch(e){aibAlert(e.message)}}async function deleteCashMove(id){if(!await aibConfirm('تحذير: سيتم حذف العملية نهائياً من سجل الصندوق. وإذا كانت تحويلاً فسيُحذف طرفاه. هل أنت متأكد؟','حذف العملية بالكامل',true))return;try{await api('/cash-movements/'+id,{method:'DELETE'});await renderPage('cash')}catch(e){aibAlert(e.message)}}async function saveCash(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount);try{await api('/cash-movements',{method:'POST',body:f});await renderPage('cash')}catch(e){aibAlert(e.message)}}async function saveCashTransfer(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount);try{await api('/cash-transfers',{method:'POST',body:f});await renderPage('cash')}catch(e){aibAlert(e.message)}}async function viewCashBox(name){try{const rows=await api('/cash-boxes/'+encodeURIComponent(name)+'/movements');const box=document.getElementById('content');box.innerHTML=`<div class="page-head"><h2>${tr('viewBox')}: ${esc(name)}</h2><div class="toolbar"><button class="btn secondary" onclick="printCashReport(window.cashBoxRows,'${esc(name)}')">${tr('printReport')}</button><button class="btn secondary" onclick="renderPage('cash')">${tr('cash')}</button></div></div>${tableCash(rows)}`;window.cashBoxRows=rows}catch(e){aibAlert(e.message)}}function printCashReport(rows,title){if(!hasPerm('cash','print')){aibAlert('ليس لديك إذن طباعة تقارير الصندوق');return}const data=rows||[];const body=data.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.box_name)+'</td><td>'+esc(x.movement==='deposit'?'إيداع':x.movement==='withdrawal'?'سحب':'تحويل')+'</td><td>'+fmt(x.amount)+'</td><td>'+esc(x.currency)+'</td><td>'+esc(x.description||'')+'</td><td>'+new Date(x.created_at).toLocaleString()+'</td></tr>').join('');const p=document.getElementById('print');p.innerHTML='<div class="invoice-sheet" style="width:196mm;margin:auto;padding:5mm;color:#263746;font-family:Tahoma;border:1px solid #d9e1e8"><div style="height:3mm;background:linear-gradient(90deg,#173b5e,#247b91,#e58a42);margin:-5mm -5mm 4mm"></div><div style="display:flex;align-items:center;gap:10mm;margin:2mm 0 4mm"><img src="/logos/aib-group-logo.webp?v=20261111" alt="AIB" style="display:block;width:42mm;height:auto;max-height:22mm;object-fit:contain;margin:auto"><div><b style="font-size:17px;color:#173b5e">مجموعة AIB التجارية</b><div style="font-size:10px;color:#68717a">التقارير المالية وكشوف الحسابات</div></div></div><h2 style="color:#173b5e;border-bottom:2px solid #247b91;padding-bottom:3mm">'+esc(title)+'</h2><p>مجموعة AIB التجارية · تقرير حركات الصندوق · السجل التجاري 96133/2025</p><table style="width:100%;border-collapse:collapse"><thead><tr><th>#</th><th>الصندوق</th><th>الحركة</th><th>المبلغ</th><th>العملة</th><th>البيان</th><th>التاريخ</th></tr></thead><tbody>'+body+'</tbody></table></div>';window.print()}async function deleteUser(id){const u=(users||[]).find(x=>x.id===id);if(!u||u.role==='owner')return;if(!await aibConfirm('سيتم حذف حساب الموظف «'+u.name+'» نهائياً ومنعه من تسجيل الدخول. هل تريد المتابعة؟','حذف حساب الموظف',true))return;try{await api('/users/'+id,{method:'DELETE'});await renderPage('users');aibAlert('تم حذف حساب الموظف')}catch(e){aibAlert(e.message)}}

function normalizeEmployeeEmailCode(value){return Array.from(String(value??'').normalize('NFKC')).map(ch=>{const n=ch.codePointAt(0);if(n>=0x0660&&n<=0x0669)return String(n-0x0660);if(n>=0x06F0&&n<=0x06F9)return String(n-0x06F0);if(n>=0xFF10&&n<=0xFF19)return String(n-0xFF10);return ch}).join('').replace(/[\s\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'')}

async function userActive(id,a){try{await api('/users/'+id+'/active?active='+a,{method:'PATCH'});await renderPage('users')}catch(e){aibAlert(e.message)}}async function editRecord(id){let r=records.find(x=>x.id===id);if(!r){await load();r=records.find(x=>x.id===id)}recordForm(r)}async function deleteRecord(id){if(!await aibConfirm('تأكيد حذف هذا السجل؟','تأكيد الحذف',true))return;try{await api('/records/'+id,{method:'DELETE'});await renderPage('records')}catch(e){aibAlert(e.message)}}async function requestRecordChange(id,action){let reason=await aibPrompt(tr('reason'),{title:action==='delete'?'طلب حذف السجل':'طلب تعديل السجل',placeholder:'اكتب سبب الطلب هنا...',multiline:true});if(reason===null||!reason.trim())return;let proposed_data=null;if(action==='update'){let r=records.find(x=>x.id===id);let raw=await aibPrompt('أدخل البيانات المقترحة بصيغة JSON',{title:'البيانات المقترحة',placeholder:'JSON',multiline:true,initial:JSON.stringify(r?.data||{},null,2)});if(raw===null)return;try{proposed_data=JSON.parse(raw)}catch{aibAlert('JSON غير صالح');return}}try{await api('/records/'+id+'/change-requests',{method:'POST',body:{action,reason:reason.trim(),proposed_data}});aibAlert('تم إرسال الطلب للمدير');refreshRequestBadge();}catch(e){aibAlert(e.message)}}async function review(id,approve){try{await api('/change-requests/'+id+'/approve?approve='+approve,{method:'POST'});await renderPage('requests');refreshRequestBadge()}catch(e){aibAlert(e.message)}}async function openApprovedChange(id){try{await load();const req=requests.find(x=>x.id===id);const rec=records.find(x=>x.id===req?.record_id);if(!req||!rec)throw new Error('تعذر العثور على السجل المرتبط بالطلب');if(req.proposed_data)rec.data=req.proposed_data;recordForm(rec,id)}catch(e){aibAlert(e.message)}}async function executeApprovedDelete(id){if(!await aibConfirm('وافق المالك على حذف السجل. هل تريد تنفيذ الحذف الآن؟','تنفيذ الحذف',true))return;try{await api('/change-requests/'+id+'/apply',{method:'POST',body:{}});await renderPage('requests');refreshRequestBadge()}catch(e){aibAlert(e.message)}}async function refreshRequestBadge(){const badge=document.getElementById('requestCountBadge');if(!badge||!me||me.role!=='owner'){if(badge)badge.classList.add('hidden');return}try{const rows=await api('/change-requests');const n=rows.filter(x=>x.status==='pending').length;badge.textContent=n;badge.classList.toggle('hidden',n===0);badge.title=n+' طلبات تنتظر المراجعة'}catch(e){badge.classList.add('hidden')}}
setInterval(()=>{if(me&&me.role==='owner')refreshRequestBadge()},30000);function filterRows(){let q=document.getElementById('filter').value.toLowerCase();document.getElementById('recordsTable').innerHTML=tableRecords(records.filter(r=>JSON.stringify(r).toLowerCase().includes(q)))}

async function chooseInvoiceBrand(){
 if(me?.role!=='owner')return 'default';
 return new Promise(resolve=>{
  const root=document.getElementById('aibDialog'),titleEl=document.getElementById('aibDialogTitle'),messageEl=document.getElementById('aibDialogMessage'),actions=document.getElementById('aibDialogActions');
  titleEl.textContent='اختيار اسم الشركة على الفاتورة';messageEl.textContent='اختر الجهة التي تريد أن تظهر في رأس الفاتورة وختمها، مع بقاء التصميم والمقاسات كما هي.';root.dir='rtl';actions.innerHTML='';
  const field=document.createElement('select');field.className='aib-dialog-input';field.style.cssText='width:100%;margin:12px 0;padding:12px;border:1px solid #9aaab4;border-radius:10px;background:#fff;color:#243746;font:inherit';
  [['aab_ibrahim','مجموعة AIB — شركة الإبراهيم لتجارة الشاحنات'],['aab_electrical','مجموعة AIB التجارية — صالة محمد الشيباني للأدوات المنزلية'],['default','مجموعة AIB التجارية (الاسم الحالي)']].forEach(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;field.appendChild(o)});
  messageEl.after(field);
  const finish=value=>{field.remove();root.classList.add('hidden');document.removeEventListener('keydown',onKey);resolve(value)};
  const onKey=e=>{if(e.key==='Escape')finish(null);if(e.key==='Enter'){e.preventDefault();finish(field.value)}};
  const cancel=document.createElement('button');cancel.className='btn secondary';cancel.type='button';cancel.textContent='إلغاء';cancel.onclick=()=>finish(null);actions.appendChild(cancel);
  const ok=document.createElement('button');ok.className='btn aib-confirm-main';ok.type='button';ok.textContent='متابعة الطباعة';ok.onclick=()=>finish(field.value);actions.appendChild(ok);
  root.classList.remove('hidden');document.addEventListener('keydown',onKey);field.focus();
 });
}
