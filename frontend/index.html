<style>

r{position:sticky;top:0;z-index:5;background:#151a20ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.user-pill{border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--silver);font-size:13px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;max-width:1600px;margin:auto;padding:18px}.sidebar{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;height:fit-content;position:sticky;top:94px}.nav{display:grid;gap:6px}.nav button{text-align:right;border:0;border-radius:10px;background:transparent;color:#c5cdd3;padding:12px}.nav button.active,.nav button:hover{background:#343d46;color:white}.nav button.active{border-right:3px solid var(--accent)}main{min-width:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}.page-head h2{margin:0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.card{background:linear-gradient(145deg,#20262d,#191e24);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:8px;color:var(--silver)}.card{margin-top:14px}.card h3{font-size:16px;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 12px}.form-grid .field{margin:5px 0 10px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:11px 12px;border-bottom:1px solid #303941;font-size:13px;vertical-align:top}th{color:#c6cfd5;background:#252d34;position:sticky;top:0}td{color:#e1e5e8}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:7px 9px;font-size:12px}.t -area .card{background:white;border:0}}
</style></head><body>
<div id="login" class="login-wrap"><section class="login-card"><div class="brand login-brand"><img src="/logo.png" alt="AIB"><div><strong>AIB GROUP</strong><span>نظام الإدارة والمحاسبة</span></div></div><h1 data-i="loginTitle">تسجيل الدخول</h1><p data-i="loginSub">منصة مجموعة AIB التجارية الآمنة</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label data-i="username">اسم المستخدم</label><input id="username" autocomplete="username" required></div><div class="field"><label data-i="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn full" type="submit" data-i="loginBtn">دخول آمن</button></form><div class="toolbar" style="justify-content:center;margin-top:16px"><button class="btn secondary" onclick="toggleLang()">العربية / English</button></div><div class="foot">AIB • Secure Business Workspace</div></section></div>
<div id="app" class="hidden"><header class="topbar no-print"><div class="brand"><img src="/logo.png" alt="AIB"><div><strong>AIB GROUP</strong><span>مجموعة AIB التجارية</span></div></div><div class="top-actions"><span class="user-pill" id="who"></span><button class="btn secondary" onclick="toggleLang()">عربي / EN</button><button class="btn danger" onclick="logout()" data-i="logout">خروج</button></div></header><div class="layout no-print"><aside class="sidebar"><nav class="nav" id="nav"><button class="active" data-page="dashboard" onclick="go('dashboard',this)" data-i="dashboard">الرئيسية</button><button data-page="records" onclick="go('records',this)" data-i="records">السجلات والفواتير</button><button data-page="cash" onclick="go('cash',this)" data-i="cash">الصناديق والحركات</button><button data-page="users" class="owner-only" onclick="go('users',this)" data-i="users">المستخدمون</button><button data-page="requests" onclick="go('requests',this)" data-i="requests">طلبات التعديل والحذف</button><button data-page="audit" class="owner-only" onclick="go('audit',this)" data-i="audit">سجل المستخدمين</button></nav></aside><main id="content"></main></div><div class="foot no-print">AIB GROUP · البيانات محفوظة في قاعدة البيانات المركزية</div></div>

<script>
const API='';let token='',me=null,lang='ar',records=[],cash=[],users=[],requests=[];const T={ar:{loginTitle:'تسجيل الدخول',loginSub:'منصة مجموعة AIB التجارية الآمنة',username:'اسم المستخدم',password:'كلمة المرور',loginBtn:'دخول آمن',logout:'خروج',dashboard:'الرئيسية',records:'السجلات والفواتير',cash:'الصناديق والحركات',users:'المستخدمون',requests:'طلبات التعديل والحذف',audit:'سجل المستخدمين',welcome:'مرحباً',total:'إجمالي السجلات',cashMoves:'الحركات النقدية',pending:'طلبات معلقة',addRecord:'إضافة سجل جديد',section:'القسم',invoice:'رقم الفاتورة',currency:'العملة',description:'البيان / الشرح',model:'الموديل',chassis:'رقم الشاسيه',year:'سنة الصنع',qty:'العدد',price:'سعر الوحدة',amount:'المبلغ',customer:'العميل / المورد',service:'عملية خدمية',save:'حفظ في قاعدة البيانات',search:'بحث...',date:'التاريخ',actions:'الإجراءات',box:'الصندوق',movement:'نوع الحركة',deposit:'إيداع',withdrawal:'سحب',transfer_in:'تحويل وارد',transfer_out:'تحويل صادر',addMove:'تسجيل حركة',name:'الاسم الكامل',newUser:'اسم المستخدم الجديد',newPass:'كلمة المرور (12 حرفاً على الأقل)',createUser:'إنشاء مستخدم',employee:'موظف',owner:'مدير',approve:'موافقة',reject:'رفض',edit:'تعديل',delete:'حذف',print:'طباعة الفاتورة',reason:'سبب الطلب',requestEdit:'طلب تعديل',requestDelete:'طلب حذف',created:'تم الحفظ بنجاح',noRows:'لا توجد بيانات بعد',loginError:'تعذر تسجيل الدخول',selectSection:'اختر القسم',depositSec:'ودائع الأمانة',purchase:'المشتريات',consign:'مبيع الأمانة',direct:'المبيع المباشر',repair:'الصيانة والتصليح',serviceNote:'عند اختيار خدمة، لا يلزم إدخال العدد أو سعر الوحدة.',saveFirst:'احفظ السجل أولاً ثم اطبع الفاتورة.'},en:{loginTitle:'Sign in',loginSub:'Secure AIB Trading Group workspace',username:'Username',password:'Password',loginBtn:'Secure sign in',logout:'Sign out',dashboard:'Dashboard',records:'Records & invoices',cash:'Cash boxes',users:'Users',requests:'Change requests',audit:'User activity log',welcome:'Welcome',total:'Total records',cashMoves:'Cash movements',pending:'Pending requests',addRecord:'Create record',section:'Section',invoice:'Invoice number',currency:'Currency',description:'Description',model:'Model',chassis:'VIN / Chassis',year:'Year',qty:'Quantity',price:'Unit price',amount:'Amount',customer:'Customer / Supplier',service:'Service transaction',save:'Save to database',search:'Search...',date:'Date',actions:'Actions',box:'Cash box',movement:'Movement type',deposit:'Deposit',withdrawal:'Withdrawal',transfer_in:'Transfer in',transfer_out:'Transfer out',addMove:'Save movement',name:'Full name',newUser:'New username',newPass:'Password (min 12 chars)',createUser:'Create user',employee:'Employee',owner:'Manager',approve:'Approve',reject:'Reject',edit:'Edit',delete:'Delete',print:'Print invoice',reason:'Reason',requestEdit:'Request edit',requestDelete:'Request deletion',created:'Saved successfully',noRows:'No records yet',loginError:'Login failed',selectSection:'Select section',depositSec:'Consignment deposits',purchase:'Purchases',consign:'Consignment sales',direct:'Direct sales',repair:'Repairs',serviceNote:'For service transactions, quantity and unit price are not required.',saveFirst:'Save the record first, then print the invoice.'}};
function tr(k){return (T[lang]||T.ar)[k]||k}function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));if(!document.getElementById('app').classList.contains('hidden'))renderPage(currentPage)}let currentPage='dashboard';
async function api(path,opts={}){let h=opts.headers||{};if(token)h.Authorization='Bearer '+token;if(opts.body){h['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}let r=await fetch(API+path,{...opts,headers:h});let data;try{data=await r.json()}catch{data={}}if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));return data}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let msg=document.getElementById('loginMsg');msg.innerHTML='';let fd=new URLSearchParams();fd.set('username',document.getElementById('username').value.trim());fd.set('password',document.getElementById('password').value);try{let r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd});let d=await r.json();if(!r.ok)throw new Error(d.detail||tr('loginError'));token=d.access_token;me=d.user;showApp()}catch(err){msg.innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}});
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=me.name+' · '+(me.role==='owner'?tr('owner'):tr('employee'));document.querySelectorAll('.owner-only').forEach(x=>x.classList.toggle('hidden',me.role!=='owner'));go('dashboard',document.querySelector('[data-page="dashboard"]'))}
function logout(){token='';me=null;records=[];document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return Number(v||0).toLocaleString(lang==='ar'?'ar-SY':'en-US',{maximumFractionDigits:2})}function go(p,b){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));renderPage(p)}
async function load(){[records,cash]=await Promise.all([api('/records'),api('/cash-movements')]);}
async function renderPage(p){let c=document.getElementById('content');c.innerHTML='<div class="empty">…</div>';try{if(p==='dashboard'){await load();let pending=me.role==='owner'?await api('/change-requests'):await api('/my-change-requests');c.innerHTML=`<div class="page-head"><h2>${tr('welcome')}، ${esc(me.name)}</h2><span class="tag">${me.role==='owner'?tr('owner'):tr('employee')}</span></div><div class="grid"><div class="stat"><span>${tr('total')}</span><strong>${records.length}</strong></div><div class="stat"><span>${tr('cashMoves')}</span><strong>${cash.length}</strong></div><div class="stat"><span>${tr('pending')}</span><strong>${pending.filter(x=>x.status==='pending').length}</strong></div><div class="stat"><span>AIB</span><strong>●</strong><span>PostgreSQL · API</span></div></div><section class="card"><h3>${tr('records')}</h3>${tableRecords(records.slice(0,8))}</section>`}
else if(p==='records'){await load();c.innerHTML=`<div class="page-head"><h2>${tr('records')}</h2><div class="toolbar"><input id="filter" placeholder="${tr('search')}" oninput="filterRows()"><button class="btn" onclick="recordForm()">＋ ${tr('addRecord')}</button></div></div><div id="recordsTable">${tableRecords(records)}</div>`}
else if(p==='cash'){cash=await api('/cash-movements');let sums=await api('/cash-summary');c.innerHTML=`<div class="page-head"><h2>${tr('cash')}</h2></div><section class="card"><h3>${tr('addMove')}</h3><form id="cashForm"><div class="form-grid"><div class="field"><label>${tr('box')}</label><select name="box_name"><option>صندوق الإيداع</option><option>صندوق مبيع الأمانة</option><option>صندوق المبيع</option></select></div><div class="field"><label>${tr('movement')}</label><select name="movement"><option value="deposit">${tr('deposit')}</option><option value="withdrawal">${tr('withdrawal')}</option><option value="transfer_in">${tr('transfer_in')}</option><option value="transfer_out">${tr('transfer_out')}</option></select></div><div class="field"><label>${tr('amount')}</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>${tr('currency')}</label><select name="currency"><option>USD</option><option>SYP</option></select></div><div class="field" style="grid-column:span 2"><label>${tr('description')}</label><input name="description"></div></div><button class="btn">${tr('addMove')}</button></form></section><section class="card"><h3>أرصدة الصناديق</h3><div class="grid">${sums.map(x=>`<div class="stat"><span>${esc(x.box_name)} · ${x.currency}</span><strong>${fmt(x.balance)}</strong></div>`).join('')||tr('noRows')}</div></section><section class="card"><h3>${tr('cashMoves')}</h3>${tableCash(cash)}</section>`;document.getElementById('cashForm').onsubmit=saveCash}
else if(p==='users'){users=await api('/users');c.innerHTML=`<div class="page-head"><h2>${tr('users')}</h2></div><section class="card"><h3>${tr('createUser')}</h3><form id="userForm"><div class="form-grid"><div class="field"><label>${tr('newUser')}</label><input name="username" minlength="3" required></div><div class="field"><label>${tr('name')}</label><input name="full_name" required></div><div class="field"><label>${tr('newPass')}</label><input name="password" type="password" minlength="12" required></div></div><button class="btn">${tr('createUser')}</button></form></section><section class="card"><h3>${tr('users')}</h3>${tableUsers(users)}</section>`;document.getElementById('userForm').onsubmit=saveUser}
else if(p==='requests'){requests=me.role==='owner'?await api('/change-requests'):await api('/my-change-requests');c.innerHTML=`<div class="page-head"><h2>${tr('requests')}</h2></div>${tableRequests(requests)}`}
else if(p==='audit'){let rows=await api('/audit-log');c.innerHTML=`<div class="page-head"><h2>${tr('audit')}</h2></div>${tableAudit(rows)}`}
}catch(e){c.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function tableRecords(rows){if(!rows.length)return `<div class="empty">${tr('noRows')}</div>`;return `<div class="table-wrap"><table><thead><tr><th>#</th><th>${tr('section')}</th><th>${tr('invoice')}</th><th>${tr('description')}</th><th>${tr('amount')}</th><th>${tr('date')}</th><th>${tr('actions')}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id}</td><td>${sectionName(r.section)}</td><td>${esc(r.invoice_no||'—')}</td><td>${esc(r.data.description||r.data.details||r.data.model||'—')}</td><td>${fmt(r.data.amount??r.data.price??r.data.sale??0)} ${r.currency}</td><td>${new Date(r.created_at).toLocaleDateString()}</td><td><div class="actions"><button class="btn secondary" onclick="printRecord(${r.id})">${tr('print')}</button>${me.role==='owner'?`<button class="btn secondary" onclick="editRecord(${r.id})">${tr('edit')}</button><button class="btn danger" onclick="deleteRecord(${r.id})">${tr('delete')}</button>`:`<button class="btn secondary" onclick="requestRecordChange(${r.id},'update')">${tr('requestEdit')}</button><button class="btn danger" onclick="requestRecordChange(${r.id},'delete')">${tr('requestDelete')}</button>`}</div></td></tr>`).join('')}</tbody></table></div>`}
function sectionName(s){return ({deposit:tr('depositSec'),purchase:tr('purchase'),consignSale:tr('consign'),directSale:tr('direct'),repair:tr('repair')})[s]||s}function fieldName(k){return ({model:tr('model'),chassis:tr('chassis'),year:tr('year'),quantity:tr('qty'),price:tr('price'),amount:tr('amount'),description:tr('description'),customer:tr('customer'),cash_box:tr('box'),details:tr('description')})[k]||k}function tableCash(rows){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>${tr('box')}</th><th>${tr('movement')}</th><th>${tr('amount')}</th><th>${tr('currency')}</th><th>${tr('description')}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.id}</td><td>${esc(x.box_name)}</td><td>${tr(x.movement)}</td><td>${fmt(x.amount)}</td><td>${x.currency}</td><td>${esc(x.description)}</td></tr>`).join('')}</tbody></table></div>`}function tableUsers(rows){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>${tr('newUser')}</th><th>${tr('name')}</th><th>${tr('actions')}</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${u.id}</td><td>${esc(u.username)}</td><td>${esc(u.name)} <span class="tag">${tr(u.role)}</span></td><td><button class="btn ${u.active?'danger':'success'}" onclick="userActive(${u.id},${!u.active})">${u.active?'تعطيل':'تفعيل'}</button></td></tr>`).join('')}</tbody></table></div>`}function tableRequests(rows){if(!rows.length)return `<div class="empty">${tr('noRows')}</div>`;return `<div class="table-wrap"><table><thead><tr><th>#</th><th>Record</th><th>Action</th><th>${tr('reason')}</th><th>Status</th>${me.role==='owner'?'<th>Review</th>':''}</tr></thead><tbody>${rows.map(x=>`<tr><td>${x.id}</td><td>${x.record_id}</td><td>${x.action}</td><td>${esc(x.reason)}</td><td>${x.status}</td>${me.role==='owner'?`<td><div class="actions"><button class="btn success" onclick="review(${x.id},true)">${tr('approve')}</button><button class="btn danger" onclick="review(${x.id},false)">${tr('reject')}</button></div></td>`:''}</tr>`).join('')}</tbody></table></div>`}function tableAudit(rows){return `<div class="table-wrap"><table><thead><tr><th>#</th><th>User</th><th>Action</th><th>Entity</th><th>IP</th><th>Date</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.id}</td><td>${x.user_id??'—'}</td><td>${esc(x.action)}</td><td>${esc(x.entity)} #${x.entity_id??''}</td><td>${esc(x.ip_address)}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
function recordForm(r=null){let d=r?.data||{};document.getElementById('modalTitle').textContent=tr('addRecord');document.getElementById('modalBody').innerHTML=`<form id="recordForm"><div class="form-grid"><div class="field"><label>${tr('section')}</label><select name="section" id="sectionSel"><option value="deposit">${tr('depositSec')}</option><option value="purchase">${tr('purchase')}</option><option value="consignSale">${tr('consign')}</option><option value="directSale">${tr('direct')}</option><option value="repair">${tr('repair')}</option></select></div><div class="field"><label>${tr('invoice')}</label><input name="invoice_no" value="${esc(r?.invoice_no||'')}"></div><div class="field"><label>${tr('currency')}</label><select name="currency"><option ${r?.currency!=='SYP'?'selected':''}>USD</option><option ${r?.currency==='SYP'?'selected':''}>SYP</option></select></div><div class="field"><label>${tr('model')}</label><input name="model" value="${esc(d.model||'')}"></div><div class="field"><label>${tr('chassis')}</label><input name="chassis" value="${esc(d.chassis||'')}"></div><div class="field"><label>${tr('year')}</label><input name="year" value="${esc(d.year||'')}"></div><div class="field"><label>${tr('customer')}</label><input name="customer" value="${esc(d.customer||'')}"></div><div class="field"><label>${tr('box')}</label><select name="cash_box"><option ${d.cash_box==='صندوق الإيداع'?'selected':''}>صندوق الإيداع</option><option ${d.cash_box==='صندوق مبيع الأمانة'?'selected':''}>صندوق مبيع الأمانة</option><option ${d.cash_box==='صندوق المبيع'?'selected':''}>صندوق المبيع</option></select></div><div class="field"><label>${tr('qty')}</label><input name="quantity" id="qty" type="number" min="0" step="any" value="${esc(d.quantity||'')}"></div><div class="field"><label>${tr('price')}</label><input name="price" id="price" type="number" min="0" step="any" value="${esc(d.price||'')}"></div><div class="field"><label>${tr('amount')}</label><input name="amount" type="number" min="0" step="any" value="${esc(d.amount||'')}"></div><div class="field"><label>${tr('description')}</label><input name="description" value="${esc(d.description||d.details||'')}"></div><div class="field"><label><input type="checkbox" id="service" name="is_service" ${d.is_service?'checked':''} style="width:auto"> ${tr('service')}</label></div></div><div class="notice">${tr('serviceNote')}</div><button class="btn full">${tr('save')}</button></form>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('sectionSel').value=r?.section||'deposit';let svc=document.getElementById('service');svc.onchange=()=>{document.getElementById('qty').disabled=svc.checked;document.getElementById('price').disabled=svc.checked};svc.dispatchEvent(new Event('change'));const qel=document.getElementById('qty'),pel=document.getElementById('price'),ael=document.querySelector('#recordForm [name=amount]');function calcTotal(){if(!svc.checked&&qel.value!==''&&pel.value!=='')ael.value=(Number(qel.value)*Number(pel.value)).toFixed(2)}qel.addEventListener('input',calcTotal);pel.addEventListener('input',calcTotal);document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),section=f.get('section'),currency=f.get('currency');let data={};for(let [k,v] of f.entries())if(!['section','invoice_no','currency'].includes(k)&&k!=='is_service'&&v!=='')data[k]=['quantity','price','amount','year'].includes(k)?Number(v):v;data.is_service=svc.checked;if(svc.checked){delete data.quantity;delete data.price}try{if(r){await api('/records/'+r.id,{method:'PATCH',body:{data,invoice_no:f.get('invoice_no')||null,currency}})}else{await api('/records',{method:'POST',body:{section,invoice_no:f.get('invoice_no')||null,currency,data}})}closeModal();await renderPage('records')}catch(err){alert(err.message)}}}
function closeModal(){document.getElementById('modal').classList.add('hidden')}async function saveCash(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.amount=Number(f.amount);try{await api('/cash-movements',{method:'POST',body:f});await renderPage('cash')}catch(e){alert(e.message)}}async function saveUser(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{await api('/users',{method:'POST',body:f});await renderPage('users')}catch(e){alert(e.message)}}async function userActive(id,a){try{await api('/users/'+id+'/active?active='+a,{method:'PATCH'});await renderPage('users')}catch(e){alert(e.message)}}async function editRecord(id){let r=records.find(x=>x.id===id);if(!r){await load();r=records.find(x=>x.id===id)}recordForm(r)}async function deleteRecord(id){if(!confirm('تأكيد الحذف؟'))return;try{await api('/records/'+id,{method:'DELETE'});await renderPage('records')}catch(e){alert(e.message)}}async function requestRecordChange(id,action){let reason=prompt(tr('reason'));if(!reason)return;let proposed_data=null;if(action==='update'){let r=records.find(x=>x.id===id);let raw=prompt('أدخل البيانات المقترحة بصيغة JSON',JSON.stringify(r?.data||{}));if(!raw)return;try{proposed_data=JSON.parse(raw)}catch{alert('JSON غير صالح');return}}try{await api('/records/'+id+'/change-requests',{method:'POST',body:{action,reason,proposed_data}});alert('تم إرسال الطلب للمدير');}catch(e){alert(e.message)}}async function review(id,approve){try{await api('/change-requests/'+id+'/approve?approve='+approve,{method:'POST'});await renderPage('requests')}catch(e){alert(e.message)}}function filterRows(){let q=document.getElementById('filter').value.toLowerCase();document.getElementById('recordsTable').innerHTML=tableRecords(records.filter(r=>JSON.stringify(r).toLowerCase().includes(q)))}
async function printRecord(id){let r=records.find(x=>x.id===id)|| (await api('/records')).find(x=>x.id===id);if(!r)return;let d=r.data;let rows=Object.entries(d).filter(([k,v])=>v!==''&&v!==null&&v!==undefined&&k!=='is_service').map(([k,v])=>`<tr><th>${esc(fieldName(k))}</th><td>${esc(v)}</td></tr>`).join('');let p=document.getElementById('print');p.innerHTML=`<div style="font-family:Arial;padding:24px;max-width:900px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #222;padding-bottom:14px"><div><h1>AIB GROUP</h1><b>مجموعة AIB التجارية</b><p>رقم السجل التجاري: 96133/2025 · عضوية غرفة تجارة حلب: 24879</p></div><img src="/logo.png" style="width:100px;height:100px;object-fit:contain"></div><h2 style="text-align:center">${sectionName(r.section)}</h2><p>رقم الفاتورة: ${esc(r.invoice_no||r.id)}　 |　 التاريخ: ${new Date(r.created_at).toLocaleDateString()}　 |　 العملة: ${r.currency}</p><table style="width:100%;border-collapse:collapse">${rows}</table><p style="margin-top:55px">صاحب الشركة: عبد الكريم محمد بن خيرو</p><p>نُظّمت بواسطة: ${esc(me.name)}</p><p style="margin-top:70px">ختم الشركة</p></div>`;window.print()}
</script></body></html>
