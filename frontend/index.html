function tr(k){return (T[lang]||T.ar)[k]||k}function toggleLang(){lang=lang==='ar'?'en':'ar';document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));if(!document.getElementById('app').classList.contains('hidden'))renderPage(currentPage)}let currentPage='dashboard';
async function api(path,opts={}){let h=opts.headers||{};if(token)h.Authorization='Bearer '+token;if(opts.body){h['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}let r=await fetch(API+path,{...opts,headers:h});let data;try{data=await r.json()}catch{data={}}if(!r.ok)throw new Error(data.detail||('HTTP '+r.status));return data}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();let msg=document.getElementById('loginMsg');msg.innerHTML='';let fd=new URLSearchParams();fd.set('username',document.getElementById('username').value.trim());fd.set('password',document.getElementById('password').value);try{let r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd});let d=await r.json();if(!r.ok)throw new Error(d.detail||tr('loginError'));token=d.access_token;me=d.user;showApp()}catch(err){msg.innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}});
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=me.name+' · '+(me.role==='owner'?tr('owner'):tr('employee'));document.querySelectorAll('.owner-only').forEach(x=>x.classList.toggle('hidden',me.role!=='owner'));go('dashboard',document.querySelector('[data-page="dashboard"]'))}
function logout(){token='';me=null;records=[];document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('password').value=''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return Number(v||0).toLocaleString(lang==='ar'?'ar-SY':'en-US',{maximumFractionDigits:2})}function go(p,b){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));renderPage(p)}
async function load(){[records,cash]=await Promise.all([api('/records'),api('/cash-movements')]);}
async function renderPage(p){let c=document.getElementById('content');c.innerHTML='<div class="empty">…</div>';try{if(p==='dashboard'){await load();let pending=me.role==='owner'?await api('/change-requests'):await api('/my-change-requests');c.innerHTML=`<div class="page-head"><h2>${tr('welcome')}، ${esc(me.name)}</h2><span class="tag">${me.role==='owner'?tr('owner'):tr('employee')}</span></div><div class="grid"><div class="stat"><span>${tr('total')}</span><strong>${records.length}</strong></div><div class="stat"><span>${tr('cashMoves')}</span><strong>${cash.length}</strong></div><div class="stat"><span>${tr('pending')}</span><strong>${pending.filter(x=>x.status==='pending').length}</strong></div><div class="stat"><span>AIB</span><strong>●</strong><span>PostgreSQL · API</span></div></div><section class="card"><h3>${tr('records')}</h3>${tableRecords(records.slice(0,8))}</section>`}
else if(p==='records'){await load();c.innerHTML=`<div class="page-head"><h2>${tr('records')}</h2><div class="toolbar"><input id="filter" placeholder="${tr('search')}" oninput="filterRows()"><button class="btn" onclick="recordForm()">＋ ${tr('addRecord')}</button></div></div><div class="toolbar" style="margin:0 0 12px"><button class="btn secondary" onclick="renderSectionRecords('directSale')">${tr('direct')}</button><button class="btn secondary" onclick="renderSectionRecords('purchase')">${tr('purchase')}</button><button class="btn secondary" onclick="renderSectionRecords('deposit')">${tr('depositSec')}</button><button class="btn secondary" onclick="renderSectionRecords('consignSale')">${tr('consign')}</button><button class="btn secondary" onclick="renderSectionRecords('repair')">${tr('repair')}</button><button class="btn secondary" onclick="renderSectionRecords('all')">${tr('allSections')}</button></div><div id="recordsTable">${tableRecords(records)}</div>`}
else if(p==='cash'){cash=await api('/cash-movements');let sums=await api('/cash-summary');const boxNames=[...new Set([...sums.map(x=>x.box_name),...cash.map(x=>x.box_name),'صندوق الإيداع','صندوق مبيع الأمانة','صندوق المبيع'])];const opts=boxNames.map(n=>'<option>'+esc(n)+'</option>').join('');c.innerHTML=`<div class="page-head"><h2>${tr('cash')}</h2><button class="btn secondary" onclick="printCashReport(cash,'تقرير جميع الصناديق')">${tr('printReport')}</button></div><section class="card"><h3>${tr('addMove')}</h3><form id="cashForm"><div class="form-grid"><div class="field"><label>${tr('box')}</label><select name="box_name">${opts}</select></div><div class="field"><label>${tr('movement')}</label><select name="movement"><option value="deposit">${tr('deposit')}</option><option value="withdrawal">${tr('withdrawal')}</option></select></div><div class="field"><label>${tr('amount')}</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>${tr('currency')}</label><select name="currency"><option>USD</option><option>SYP</option></select></div><div class="field" style="grid-column:span 2"><label>${tr('description')}</label><input name="description"></div></div><button class="btn">${tr('addMove')}</button></form></section><section class="card"><h3>${tr('transferBetween')}</h3><form id="transferForm"><div class="form-grid"><div class="field"><label>${tr('fromBox')}</label><select name="source_box" required>${opts}</select></div><div class="field"><label>${tr('toBox')}</label><select name="destination_box" required>${opts}</select></div><div class="field"><label>${tr('amount')}</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>${tr('currency')}</label><select name="currency"><option>USD</option><option>SYP</option></select></div><div class="field"><label>${tr('description')}</label><input name="description"></div></div><button class="btn">${tr('transferBetween')}</button></form><div class="notice">${tr('transferNote')}</div></section><section class="card"><h3>${tr('boxBalances')}</h3><div class="grid">${sums.map(x=>`<div class="stat"><span>${esc(x.box_name)} · ${x.currency}</span><strong>${fmt(x.balance)}</strong><div class="actions"><button class="btn secondary" onclick="viewCashBox('${esc(x.box_name)}')">${tr('viewBox')}</button></div></div>`).join('')||tr('noRows')}</div></section><section class="card"><h3>${tr('cashMoves')}</h3>${tableCash(cash)}</section>`;document.getElementById('cashForm').onsubmit=saveCash;document.getElementById('transferForm').onsubmit=saveCashTransfer}
else if(p==='users'){users=await api('/users');c.innerHTML=`<div class="page-head"><h2>${tr('users')}</h2></div><section class="card"><h3>${tr('createUser')}</h3><form id="userForm"><div class="form-grid"><div class="field"><label>${tr('newUser')}</label><input name="username" minlength="3" required></div><div class="field"><label>${tr('name')}</label><input name="full_name" required></div><div class="field"><label>${tr('newPass')}</label><input name="password" type="password" minlength="12" required></div></div><button class="btn">${tr('createUser')}</button></form></section><section class="card"><h3>${tr('users')}</h3>${tableUsers(users)}</section>`;document.getElementById('userForm').onsubmit=saveUser}
else if(p==='requests'){requests=me.role==='owner'?await api('/change-requests'):await api('/my-change-requests');c.innerHTML=`<div class="page-head"><h2>${tr('requests')}</h2></div>${tableRequests(requests)}`}
