<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">AIB GROUP</title>
<desc id="desc">Transparent corporate emblem with a globe, gear, compass, rising orange route and automotive and industrial silhouettes.</desc>
<defs>
 <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#dce6ee"/><stop offset=".58" stop-color="#8296a8"/><stop offset=".82" stop-color="#f4f7fa"/><stop offset="1" stop-color="#8294a4"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47a9ed"/><stop offset=".45" stop-color="#12649e"/><stop offset="1" stop-color="#092a49"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd08c"/><stop offset=".45" stop-color="#f18b32"/><stop offset="1" stop-color="#d85b20"/></linearGradient>
 <radialGradient id="globe" cx=".32" cy=".25" r=".8"><stop stop-color="#e9f6ff"/><stop offset=".38" stop-color="#388fc5"/><stop offset="1" stop-color="#092b4b"/></radialGradient>
 <filter id="depth" x="-20%" y="-25%" width="145%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
