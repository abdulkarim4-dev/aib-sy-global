name: AIB backend and frontend smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/accounting-store-safety, perf/aib-store-search-observability]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aib
          POSTGRES_PASSWORD: aib_test_password
          POSTGRES_DB: aib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aib -d aib_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aib:aib_test_password@localhost:5432/aib_test
      JWT_SECRET: ci-test-secret-not-for-production
      OWNER_PASSWORD: ci-test-owner-password
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m py_compile backend/app.py
      - name: Parse frontend JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for page in ("frontend/index.html", "frontend/shop.html"):
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline JavaScript found in {page}")
              output = Path("/tmp") / (Path(page).stem + "-scripts.js")
              output.write_text("\n".join(scripts), encoding="utf-8")
              print(f"{page}: extracted {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/index-scripts.js
          node --check /tmp/shop-scripts.js
      - name: Start API and verify database-backed health endpoint
        run: |
          cd backend
          uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/aib-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/aib-health.json; then
              cat /tmp/aib-health.json
              grep -q '"status":"ok"' /tmp/aib-health.json
              if ! curl --fail --silent --show-error -D /tmp/aib-search-headers http://127.0.0.1:8000/public/products -o /tmp/aib-search-all.json; then cat /tmp/aib-api.log; exit 1; fi
              python -c "import json; assert isinstance(json.load(open('/tmp/aib-search-all.json')), list)"
              grep -qi '^server-timing:' /tmp/aib-search-headers
              if ! curl --fail --silent --show-error -D /tmp/aib-search-term-headers 'http://127.0.0.1:8000/public/products?q=smoke-test' -o /tmp/aib-search-term.json; then cat /tmp/aib-api.log; exit 1; fi
              python -c "import json; assert isinstance(json.load(open('/tmp/aib-search-term.json')), list)"
              grep -qi '^x-aib-search-cache:' /tmp/aib-search-term-headers
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/aib-api.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/aib-api.log
          echo "API did not become healthy within 120 seconds"
          exit 1
