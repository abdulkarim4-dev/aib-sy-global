services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aib
      POSTGRES_USER: aib
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - aib_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aib -d aib"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://aib:${DB_PASSWORD}@db:5432/aib
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AIB_DOMAIN: ${AIB_DOMAIN:?Set AIB_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
volumes:
  aib_pgdata:
  caddy_data:
  caddy_config:
